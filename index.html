<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🎱 로또 추첨기</title>
<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(to right, #e0eafc, #cfdef3);
  margin:0; padding:0;
  display:flex; justify-content:center; align-items:flex-start; min-height:100vh;
}

.container {
  margin-top:30px;
  background:#fff;
  padding:30px 20px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  text-align:center;
  max-width:700px; width:90%;
}

h1 { margin-bottom:10px; color:#333; }
p { color:#555; margin-bottom:20px; }
button {
  padding:12px 25px; font-size:16px;
  background-color:#28a745; color:white;
  border:none; border-radius:8px;
  cursor:pointer; transition:0.2s;
}
button:hover { background-color:#218838; }

.results {
  display:flex; justify-content:center; flex-wrap:wrap; gap:15px; margin-top:20px;
}

.card {
  background:#f9f9f9; border-left:6px solid #28a745;
  padding:15px 20px; border-radius:8px;
  font-size:18px; font-weight:bold; color:#333;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.numbers {
  display:flex; justify-content:center; gap:10px; margin-top:10px; flex-wrap:wrap;
}

.ball {
  width:40px; height:40px; border-radius:50%;
  display:flex; justify-content:center; align-items:center;
  font-weight:bold; font-size:16px; color:white;
  box-shadow:0 2px 5px rgba(0,0,0,0.3);
}

/* 색상 규칙 */
.yellow { background:#FFD700; color:#333; }
.red { background:#E74C3C; }
.gray { background:#7F8C8D; }
.green { background:#27AE60; }

/* 추첨기 배경 */
.lotto-machine {
  position: relative;
  width: 400px;
  height: 300px;
  margin: 30px auto;
  background: radial-gradient(circle at 50% 50%, #e0f0ff, #a0d0ff);
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(0,0,0,0.2);
}

/* 공 둥둥 애니메이션 */
.lotto-ball {
  position: absolute;
  width: 50px; height: 50px;
  border-radius: 50%;
  display:flex; justify-content:center; align-items:center;
  font-weight:bold; font-size:18px; color:white;
  box-shadow:0 2px 5px rgba(0,0,0,0.3);
  animation: float 3s infinite alternate ease-in-out;
}

@keyframes float {
  0% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-30px) rotate(10deg); }
  100% { transform: translateY(0px) rotate(-10deg); }
}
</style>
</head>
<body>
<div class="container">
  <h1>🎱 로또 추첨기</h1>
  <p>“번호 추천” 버튼을 누르면 5세트 번호가 추첨기에서 둥둥 떠다니며 나타납니다!</p>
  <button onclick="generateLottoSets()">번호 추천!</button>

  <div class="lotto-machine" id="lottoMachine"></div>
  <div class="results" id="results"></div>
</div>

<script>
function getColorClass(num){
  if(num>=1 && num<=10) return 'yellow';
  if(num>=11 && num<=20) return 'red';
  if(num>=21 && num<=30) return 'gray';
  if(num>=31 && num<=45) return 'green';
}

// 추천번호 생성 및 추첨기 애니메이션
function generateLottoSets(){
  const resultContainer = document.getElementById('results');
  resultContainer.innerHTML='';

  const machine = document.getElementById('lottoMachine');
  machine.innerHTML=''; // 이전 공 제거

  for(let i=1;i<=5;i++){
    const numbers = new Set();
    while(numbers.size<6) numbers.add(Math.floor(Math.random()*45)+1);
    const sorted=Array.from(numbers).sort((a,b)=>a-b);

    // 카드 표시
    const card = document.createElement('div');
    card.className='card';
    const title = document.createElement('div'); title.textContent=`세트 ${i}`;
    card.appendChild(title);
    const numWrap = document.createElement('div'); numWrap.className='numbers';

    sorted.forEach(num=>{
      const ball = document.createElement('div');
      ball.className=`ball ${getColorClass(num)}`;
      ball.textContent=num;
      numWrap.appendChild(ball);

      // 추첨기 안에 떠다니는 공 생성
      const floatBall = document.createElement('div');
      floatBall.className=`lotto-ball ${getColorClass(num)}`;
      floatBall.textContent=num;
      floatBall.style.left=Math.random()*350+'px';
      floatBall.style.top=Math.random()*250+'px';
      machine.appendChild(floatBall);
    });

    card.appendChild(numWrap);
    resultContainer.appendChild(card);
  }
}
</script>
</body>
</html>
