<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>로또 번호 추천기 (5세트)</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e0eafc, #cfdef3);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      margin-top: 50px;
      background-color: #fff;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 600px;
      width: 90%;
    }

    h1 {
      margin-bottom: 10px;
      color: #333;
    }

    p {
      color: #555;
      margin-bottom: 30px;
    }

    button {
      padding: 14px 30px;
      font-size: 18px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #218838;
    }

    .results {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background-color: #f9f9f9;
      border-left: 6px solid #28a745;
      padding: 15px 20px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .numbers {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 10px;
    }

.ball {
background: linear-gradient(135deg, #FFD700, #FFC107);
color: #4B2E00;
border-radius: 50%;
width: 40px;
height: 40px;
display: flex;
justify-content: center;
align-items: center;
font-weight: bold;
font-size: 16px;
box-shadow: 0 2px 5px rgba(0,0,0,0.2);
 }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎱 로또 번호 추천기</h1>
    <p>이번 주 행운의 번호 5세트를 받아보세요!</p>
    <button onclick="generateLottoSets()">번호 추천!</button>

    <div class="results" id="results"></div>
  </div>

  <script>
    function generateLottoSets() {
      const resultContainer = document.getElementById('results');
      resultContainer.innerHTML = '';

      for (let i = 1; i <= 5; i++) {
        const numbers = new Set();
        while (numbers.size < 6) {
          numbers.add(Math.floor(Math.random() * 45) + 1);
        }

        const sorted = Array.from(numbers).sort((a, b) => a - b);

        const card = document.createElement('div');
        card.className = 'card';

        const title = document.createElement('div');
        title.textContent = `세트 ${i}`;
        card.appendChild(title);

        const numberWrapper = document.createElement('div');
        numberWrapper.className = 'numbers';

        sorted.forEach(num => {
          const ball = document.createElement('div');
          ball.className = 'ball';
          ball.textContent = num;
          numberWrapper.appendChild(ball);
        });

        card.appendChild(numberWrapper);
        resultContainer.appendChild(card);
      }
    }
  </script>
</body>
</html>
