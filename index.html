<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🍀 로또 추첨기</title>
<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #ffffff;
  margin:0; padding:0;
  display:flex; justify-content:center; align-items:flex-start; min-height:100vh;
}

.container {
  margin-top:30px;
  background:#fff;
  padding:30px 20px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  text-align:center;
  max-width:500px; width:95%;
}

h1 { margin-bottom:10px; color:#E57373; }
p { color:#555; margin-bottom:25px; }

/* 🍀 버튼 스타일 */
button {
  padding:18px 40px;
  font-size:22px;
  background-color:#2ecc71;
  color:white;
  border:none;
  border-radius:50px;
  cursor:pointer;
  font-weight:bold;
  box-shadow:0 5px 10px rgba(0,0,0,0.15);
  transition:transform 0.15s ease, background-color 0.2s ease;
}
button:hover {
  background-color:#27ae60;
  transform:scale(1.05);
}

.results {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
  margin-top:20px;
}

.card {
  width:100%;
  background:#fff0f0;
  border-left:6px solid #E57373;
  padding:15px 10px;
  border-radius:8px;
  font-size:18px;
  font-weight:bold;
  color:#333;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.numbers {
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}

.ball {
  width:38px; height:38px; border-radius:50%;
  display:flex; justify-content:center; align-items:center;
  font-weight:bold; font-size:15px; color:white;
  box-shadow:0 2px 5px rgba(0,0,0,0.3);
}

/* 색상 규칙 */
.yellow { background:#FFD700; color:#333; }
.red { background:#E74C3C; }
.gray { background:#7F8C8D; }
.green { background:#27AE60; }

/* 🎱 추첨기 영역 */
.lotto-machine {
  position: relative;
  width: 420px;
  height: 420px;
  margin: 40px auto;
  background: radial-gradient(circle at 50% 50%, #fffafa, #ffeaea);
  border-radius: 50%;
  border: 8px solid #777;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(0,0,0,0.2);
}

.lotto-ball {
  position: absolute;
  width:50px; height:50px;
  border-radius:50%;
  display:flex; justify-content:center; align-items:center;
  font-weight:bold; font-size:18px;
  color:white; box-shadow:0 2px 5px rgba(0,0,0,0.3);
}
</style>
</head>
<body>
<div class="container">
  <h1>🍀 로또 추첨기</h1>
  <p>위에서 공이 떨어지고 튀면서 최종 번호 6개를 결정합니다!</p>
  <button onclick="startDraw()">🍀 행운의 숫자 뽑기</button>

  <div class="lotto-machine" id="lottoMachine"></div>
  <div class="results" id="results"></div>
</div>

<script>
// 색상 구분
function getColorClass(num){
  if(num>=1 && num<=10) return 'yellow';
  if(num>=11 && num<=20) return 'red';
  if(num>=21 && num<=30) return 'gray';
  if(num>=31 && num<=45) return 'green';
}

let animationId;
let balls = [];
let finalNumbers = [];

function startDraw(){
  const machine = document.getElementById('lottoMachine');
  const resultContainer = document.getElementById('results');
  machine.innerHTML='';
  resultContainer.innerHTML='';
  balls=[];
  finalNumbers=[];

  // 45개 공 생성 (숫자 1~45)
  for(let i=1;i<=45;i++){
    const ball = document.createElement('div');
    ball.className='lotto-ball '+getColorClass(i);
    ball.textContent=i;
    ball.x = Math.random()*380 + 20;
    ball.y = -Math.random()*300; // 위에서 떨어짐
    ball.vx = (Math.random()*4-2);
    ball.vy = Math.random()*2+1; // 떨어지는 속도
    ball.isFinal=false;
    machine.appendChild(ball);
    balls.push(ball);
  }

  animateDraw();
}

function animateDraw(){
  const machine = document.getElementById('lottoMachine');
  const radius = 200;

  balls.forEach(ball=>{
    if(ball.isFinal) return;

    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.vy += 0.05; // 중력 느낌

    // 원 안에서 튕기기
    const dx = ball.x - radius;
    const dy = ball.y - radius;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist > radius-25){
      const angle = Math.atan2(dy, dx);
      ball.x = radius + (radius-25)*Math.cos(angle);
      ball.y = radius + (radius-25)*Math.sin(angle);
      ball.vx*=-1;
      ball.vy*=-0.8; // 튀고 천천히 내려감
    }

    // 바닥 근처에 도달하면 속도 느려짐
    if(ball.y > 370){
      ball.vy*=0.6;
      ball.vx*=0.98;
      // 랜덤하게 최종 번호 6개 선택
      if(finalNumbers.length < 6 && Math.random()<0.01){
        ball.isFinal=true;
        finalNumbers.push(parseInt(ball.textContent));
      }
    }

    ball.style.left = ball.x+'px';
    ball.style.top = ball.y+'px';
  });

  // 완료시 카드 생성
  if(finalNumbers.length>=6){
    displayResult(finalNumbers.sort((a,b)=>a-b));
    return;
  }

  animationId = requestAnimationFrame(animateDraw);
}

function displayResult(numbers){
  const resultContainer = document.getElementById('results');
  const card = document.createElement('div'); card.className='card';
  const title = document.createElement('div'); title.textContent='최종 번호'; card.appendChild(title);
  const numWrap = document.createElement('div'); numWrap.className='numbers';
  numbers.forEach(num=>{
    const ball=document.createElement('div'); 
    ball.className='ball '+getColorClass(num);
    ball.textContent=num;
    numWrap.appendChild(ball);
  });
  card.appendChild(numWrap);
  resultContainer.appendChild(card);
}
</script>
</body>
</html>
