<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>🍀 로또 추첨기</title>
<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #ffffff;
  margin:0; padding:0;
  display:flex; justify-content:center; align-items:flex-start; min-height:100vh;
}

.container {
  margin-top:30px;
  background:#fff;
  padding:30px 20px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  text-align:center;
  max-width:900px; width:95%;
}

h1 { margin-bottom:10px; color:#E57373; }
p { color:#555; margin-bottom:25px; }

/* 🍀 버튼 스타일 */
button {
  padding:18px 40px;
  font-size:22px;
  background-color:#2ecc71;
  color:white;
  border:none;
  border-radius:50px;
  cursor:pointer;
  font-weight:bold;
  box-shadow:0 5px 10px rgba(0,0,0,0.15);
  transition:transform 0.15s ease, background-color 0.2s ease;
}
button:hover {
  background-color:#27ae60;
  transform:scale(1.05);
}

.results {
  display:flex;
  justify-content:center;
  flex-wrap:nowrap;
  gap:15px;
  margin-top:20px;
  overflow-x:auto;
}

.card {
  flex:1;
  min-width:150px;
  background:#fff0f0;
  border-left:6px solid #E57373;
  padding:15px 10px;
  border-radius:8px;
  font-size:18px;
  font-weight:bold;
  color:#333;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.numbers {
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}

.ball {
  width:38px; height:38px; border-radius:50%;
  display:flex; justify-content:center; align-items:center;
  font-weight:bold; font-size:15px; color:white;
  box-shadow:0 2px 5px rgba(0,0,0,0.3);
}

/* 색상 규칙 */
.yellow { background:#FFD700; color:#333; }
.red { background:#E74C3C; }
.gray { background:#7F8C8D; }
.green { background:#27AE60; }

/* 🎱 추첨기 영역 */
.lotto-machine {
  position: relative;
  width: 420px;
  height: 420px;
  margin: 40px auto;
  background: radial-gradient(circle at 50% 50%, #fffafa, #ffeaea);
  border-radius: 50%;
  border: 8px solid #777;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(0,0,0,0.2);
}

.lotto-ball {
  position: absolute;
  width:50px; height:50px;
  border-radius:50%;
  display:flex; justify-content:center; align-items:center;
  font-weight:bold; font-size:18px;
  color:white; box-shadow:0 2px 5px rgba(0,0,0,0.3);
}
</style>
</head>
<body>
<div class="container">
  <h1>🍀 로또 추첨기</h1>
  <p>행운의 공들이 마구 튀며 숫자를 결정합니다!</p>
  <button onclick="generateLottoSets()">🍀 행운의 숫자 뽑기</button>

  <div class="lotto-machine" id="lottoMachine"></div>
  <div class="results" id="results"></div>
</div>

<script>
// 색상 구분
function getColorClass(num){
  if(num>=1 && num<=10) return 'yellow';
  if(num>=11 && num<=20) return 'red';
  if(num>=21 && num<=30) return 'gray';
  if(num>=31 && num<=45) return 'green';
}

// 추천번호 생성 + 공 튕기기
let balls=[]; 
let animationId;

function generateLottoSets(){
  const resultContainer = document.getElementById('results');
  resultContainer.innerHTML='';
  const machine = document.getElementById('lottoMachine');
  machine.innerHTML=''; 
  balls=[]; 
  cancelAnimationFrame(animationId);

  for(let i=1;i<=5;i++){
    const numbers=new Set();
    while(numbers.size<6) numbers.add(Math.floor(Math.random()*45)+1);
    const sorted=Array.from(numbers).sort((a,b)=>a-b);

    // 카드 표시
    const card = document.createElement('div'); card.className='card';
    const title = document.createElement('div'); title.textContent=`세트 ${i}`; card.appendChild(title);
    const numWrap = document.createElement('div'); numWrap.className='numbers';

    sorted.forEach(num=>{
      const ball=document.createElement('div'); 
      ball.className=`ball ${getColorClass(num)}`; ball.textContent=num;
      numWrap.appendChild(ball);

      // 튕기는 공 생성
      const floatBall=document.createElement('div');
      floatBall.className=`lotto-ball ${getColorClass(num)}`;
      floatBall.textContent=num;
      const radius=190;
      const angle=Math.random()*2*Math.PI;
      const r=Math.random()*radius*0.7;
      floatBall.x=210 + r*Math.cos(angle); 
      floatBall.y=210 + r*Math.sin(angle);
      floatBall.vx=(Math.random()*7-3.5); // 빠르고 역동적
      floatBall.vy=(Math.random()*7-3.5);
      floatBall.style.left=floatBall.x+'px';
      floatBall.style.top=floatBall.y+'px';
      machine.appendChild(floatBall);
      balls.push(floatBall);
    });

    card.appendChild(numWrap);
    resultContainer.appendChild(card);
  }

  animateBalls();
}

// 애니메이션
function animateBalls(){
  const radius=190; 
  balls.forEach(ball=>{
    ball.x+=ball.vx;
    ball.y+=ball.vy;

    const dx=ball.x-210;
    const dy=ball.y-210;
    if(Math.sqrt(dx*dx + dy*dy) > radius-25){
      const angle=Math.atan2(dy, dx);
      ball.x=210 + (radius-25)*Math.cos(angle);
      ball.y=210 + (radius-25)*Math.sin(angle);
      ball.vx*=-1.15; 
      ball.vy*=-1.15; 
      ball.vx=Math.max(Math.min(ball.vx,7),-7);
      ball.vy=Math.max(Math.min(ball.vy,7),-7);
    }

    ball.style.left=ball.x+'px';
    ball.style.top=ball.y+'px';
  });

  animationId=requestAnimationFrame(animateBalls);
}
</script>
</body>
</html>
