<!DOCTYPE html>
<html>
<head>
    <title>무작위 단어 추출기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        #word-output {
            font-size: 2em;
            margin: 20px;
            min-height: 1.2em; /* 단어가 로드될 때 레이아웃이 흔들리는 것을 방지 */
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>무작위 영어 단어 추출</h1>
    <div id="word-output">단어를 보려면 버튼을 누르세요.</div>
    <button onclick="displayRandomWord()">새 단어 추출</button>

    <script>
        // 무작위로 추출할 단어 목록
        const englishWords = [
            "apple",
            "banana",
            "cat",
            "dog",
            "elephant",
            "flower",
            "guitar",
            "house",
            "iceberg",
            "jacket",
            "kite",
            "lemon",
            "mountain",
            "notebook",
            "ocean",
            "penguin",
            "queen",
            "river",
            "sunshine",
            "tree",
            "umbrella",
            "volcano",
            "window",
            "xylophone",
            "yacht",
            "zebra"
        ];

        function displayRandomWord() {
            // 1. 단어 배열의 길이를 기반으로 무작위 인덱스 생성
            const randomIndex = Math.floor(Math.random() * englishWords.length);

            // 2. 무작위 단어 선택
            const randomWord = englishWords[randomIndex];

            // 3. HTML 요소에 단어 표시
            document.getElementById('word-output').textContent = randomWord;
        }
    </script>

</body>
</html>
