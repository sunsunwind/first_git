<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>☆BUS_N_WEATHER_SAFARI☆</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/DungGeunMo.css">
    <style>
        /* (기존 핑크색 디자인 스타일과 동일 - 지면상 생략, 실제 파일엔 포함하세요) */
        :root { --main-pink: #ff85bc; --soft-pink: #ffe4f0; --dark-pink: #cf3a80; --white: #ffffff; }
        body { background-color: var(--main-pink); font-family: 'DungGeunMo'; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .window { width: 370px; background: var(--white); border: 4px solid #000; box-shadow: 10px 10px 0px rgba(0,0,0,0.2); }
        .title-bar { background: var(--dark-pink); padding: 5px 10px; color: var(--white); border-bottom: 4px solid #000; display: flex; justify-content: space-between; font-size: 12px; }
        .weather-area { display: flex; background: #fff; border-bottom: 2px dashed #000; }
        .weather-col { flex: 1; padding: 10px 5px; text-align: center; border-right: 1px dotted #000; }
        .weather-col:last-child { border-right: none; }
        .content { padding: 15px; background: linear-gradient(to bottom, var(--soft-pink), var(--white)); min-height: 250px; }
        .bus-item { background: var(--white); border: 2px solid #000; margin-bottom: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .arrival-msg { color: var(--dark-pink); animation: starlight 2.5s ease-in-out infinite; }
        @keyframes starlight { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .status-bar { background: #eee; border-top: 3px solid #000; padding: 5px 10px; font-size: 11px; display: flex; justify-content: space-between; }
        #timer-fill { height: 100%; background: var(--main-pink); width: 100%; transition: width 1s linear; }
        #timer-bar { width: 50px; height: 10px; background: #ddd; border: 1px solid #000; display: inline-block; }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar"><span>SAFARI_LIVE_BUS.EXE</span><span>[×]</span></div>
    <div class="weather-area">
        <div class="weather-col"><b>범천동</b><br><small>☀️ 18°C</small></div>
        <div class="weather-col"><b>대연3동</b><br><small>⛅ 19°C</small></div>
    </div>
    <div class="content">
        <div id="bus-list"><div style="text-align:center; padding-top:50px;">사파리 연결 시도 중...</div></div>
    </div>
    <div class="status-bar">
        <div>REFRESH: <span id="sec-text">15</span>s <div id="timer-bar"><div id="timer-fill"></div></div></div>
        <div id="clock">00:00:00</div>
    </div>
</div>

<script>
    // [설정] 아래 3가지를 꼭 채워주세요!
    const BUS_KEY = '3518be1c6727b63643d44c23d2eebc692431587fae6991a090313e7fcf97cac8';
    const WEATHER_KEY = '3518be1c6727b63643d44c23d2eebc692431587fae6991a090313e7fcf97cac8';
    const GOOGLE_PROXY_URL = 'https://script.google.com/macros/s/AKfycby_D3QCOoz8ecXRR5IpocdV1nXbzjBsrDV_7IM3koS4naYWbwOrQeELUOXK-CTVriLDZg/exec'; 

    const TARGET_BUSES = ['83', '108', '83-1'];
    const BSTOP_ID = '509870000';
    const OFFSET_MAP = { '83': 18, '108': 20, '83-1': 19 };

    let timeLeft = 15;

    async function getBusData() {
        const busListContainer = document.getElementById('bus-list');
        const apiAddr = `http://apis.data.go.kr/6260000/BusanBIMS/stopArrByStopid?serviceKey=${BUS_KEY}&bstopid=${BSTOP_ID}&_type=json`;
        
        // 사파리 CORS 우회를 위해 구글 프록시를 통해 호출
        const finalUrl = `${GOOGLE_PROXY_URL}?url=${encodeURIComponent(apiAddr)}`;

        try {
            const response = await fetch(finalUrl);
            const data = await response.json();
            
            const items = data.response.body.items.item;
            const busData = Array.isArray(items) ? items : (items ? [items] : []);
            const filtered = busData.filter(bus => TARGET_BUSES.includes(String(bus.lineNo)));
            
            busListContainer.innerHTML = '';
            if (filtered.length === 0) {
                busListContainer.innerHTML = '<div style="text-align:center; padding-top:50px;">정보 없음</div>';
            } else {
                filtered.forEach(bus => {
                    const min = bus.min1;
                    busListContainer.innerHTML += `
                        <div class="bus-item">
                            <div style="font-weight:bold;">${bus.lineNo}</div>
                            <div style="text-align:right;">
                                <div class="arrival-msg">${min}분 뒤 도착</div>
                                <div style="font-size:10px; color:#666;">경성대 약 ${min + OFFSET_MAP[bus.lineNo]}분 뒤</div>
                            </div>
                        </div>`;
                });
            }
        } catch (e) {
            busListContainer.innerHTML = '<div style="text-align:center; color:red; font-size:10px; padding-top:40px;">연결 실패<br>구글 배포 설정을 확인하세요!</div>';
        }
        timeLeft = 15;
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        timeLeft--;
        document.getElementById('sec-text').innerText = timeLeft;
        document.getElementById('timer-fill').style.width = (timeLeft / 15 * 100) + '%';
        if (timeLeft <= 0) getBusData();
    }, 1000);

    getBusData();
</script>
</body>
</html>
