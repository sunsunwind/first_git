<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☆BUS_LIVE_FINAL_V7☆</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/DungGeunMo.css">
    <style>
        /* (디자인 스타일은 이전과 동일 - 핑크 감성 유지) */
        :root { --main-pink: #ff85bc; --soft-pink: #ffe4f0; --dark-pink: #cf3a80; --white: #ffffff; }
        body { background-color: var(--main-pink); font-family: 'DungGeunMo'; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box; }
        .window { width: 100%; max-width: 380px; background: var(--white); border: 4px solid #000; box-shadow: 8px 8px 0px rgba(0,0,0,0.2); }
        .title-bar { background: var(--dark-pink); padding: 6px 10px; color: var(--white); display: flex; justify-content: space-between; border-bottom: 4px solid #000; font-size: 11px; }
        .weather-area { display: flex; background: #fff; border-bottom: 2px dashed #000; }
        .weather-col { flex: 1; padding: 12px 0; text-align: center; border-right: 1px dotted #000; }
        .town-name { font-size: 0.85rem; background: var(--soft-pink); display: inline-block; padding: 2px 8px; margin-bottom: 6px; border: 1px solid #000; }
        .content { padding: 15px; background: linear-gradient(to bottom, var(--soft-pink), var(--white)); min-height: 250px; }
        .bus-item { background: var(--white); border: 2px solid #000; margin-bottom: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .arrival-msg { font-size: 1rem; color: var(--dark-pink); animation: starlight 2.5s infinite; }
        @keyframes starlight { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .status-bar { background: #eee; border-top: 3px solid #000; padding: 8px 10px; font-size: 10px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar"><span>FINAL_EMERGENCY_FIX.EXE</span><span>[X]</span></div>
    <div class="weather-area">
        <div class="weather-col"><div class="town-name">범천동</div><div style="font-size:0.75rem">☀️ 18°C</div></div>
        <div class="weather-col"><div class="town-name">대연3동</div><div style="font-size:0.75rem">⛅ 19°C</div></div>
    </div>
    <div class="content">
        <div id="bus-list"><div style="text-align:center; padding-top:40px; font-size:0.8rem;">시스템 부팅 중...</div></div>
    </div>
    <div class="status-bar">
        <div>REF: <span id="sec-text">15</span>s</div>
        <div id="clock">00:00:00</div>
    </div>
</div>

<script>
    // [1] 본인의 정보로 교체
    const BUS_KEY = '3518be1c6727b63643d44c23d2eebc692431587fae6991a090313e7fcf97cac8'; 
    const GOOGLE_PROXY_URL = 'https://script.google.com/macros/s/AKfycby_D3QCOoz8ecXRR5IpocdV1nXbzjBsrDV_7IM3koS4naYWbwOrQeELUOXK-CTVriLDZg/exec'; 
    
    // [2] 정류장 번호 (05715 범내골역 경성대 방면 전용 ID)
    const BSTOP_ID = '509870000'; 
    const TARGET_BUSES = ['83', '108', '83-1'];
    const OFFSET_MAP = { '83': 18, '108': 20, '83-1': 19 };

    let timeLeft = 15;

    async function fetchBusData() {
        const busListContainer = document.getElementById('bus-list');
        
        // [수정 포인트] 부산 API 최신 주소 체계 적용: stopArrByBstopid (B가 추가됨)
        const apiAddr = `http://apis.data.go.kr/6260000/BusanBIMS/stopArrByBstopid?serviceKey=${BUS_KEY}&bstopid=${BSTOP_ID}&_type=json`;
        const finalUrl = `${GOOGLE_PROXY_URL}?url=${encodeURIComponent(apiAddr)}`;

        try {
            const response = await fetch(finalUrl);
            const data = await response.json();

            // 만약 데이터는 왔는데 에러 메시지가 담겨있을 경우
            if (data.response && data.response.header && data.response.header.resultCode !== "00") {
                busListContainer.innerHTML = `<div style="text-align:center; font-size:0.7rem; color:red; padding-top:40px;">API 에러: ${data.response.header.resultMsg}</div>`;
                return;
            }

            const items = data.response.body.items.item;
            const busData = Array.isArray(items) ? items : (items ? [items] : []);
            const filtered = busData.filter(bus => TARGET_BUSES.includes(String(bus.lineNo)));
            
            busListContainer.innerHTML = '';
            if (filtered.length === 0) {
                busListContainer.innerHTML = '<div style="text-align:center; padding-top:40px; font-size:0.8rem;">운행 중인 버스가 없습니다.</div>';
            } else {
                filtered.forEach(bus => {
                    const min = bus.min1;
                    busListContainer.innerHTML += `
                        <div class="bus-item">
                            <div style="font-weight:bold; font-size:1.2rem;">${bus.lineNo}</div>
                            <div style="text-align: right;">
                                <div class="arrival-msg">${min}분 뒤 도착</div>
                                <div style="font-size:0.7rem; color:#666;">경성대 약 ${min + (OFFSET_MAP[bus.lineNo] || 0)}분 뒤</div>
                            </div>
                        </div>`;
                });
            }
        } catch (e) {
            // Api not found 등이 뜰 경우 어떤 주소에서 에러 났는지 화면에 표시
            busListContainer.innerHTML = `<div style="text-align:center; font-size:0.6rem; color:red; padding-top:40px;">
                주소를 찾을 수 없습니다.<br>
                1. API 키 활성화 확인 (1~2시간 소요)<br>
                2. 구글 스크립트 배포 상태 확인
            </div>`;
        }
        timeLeft = 15;
    }

    // 루프 설정
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        timeLeft--;
        document.getElementById('sec-text').innerText = (timeLeft < 0) ? 0 : timeLeft;
        if (timeLeft === 0) fetchBusData();
    }, 1000);

    fetchBusData();
</script>
</body>
</html>
