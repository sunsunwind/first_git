<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☆BUS_N_WEATHER_V3☆</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/DungGeunMo.css">
    <style>
        :root {
            --main-pink: #ff85bc;
            --soft-pink: #ffe4f0;
            --dark-pink: #cf3a80;
            --white: #ffffff;
            --starlight-glow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        body {
            background-color: var(--main-pink);
            background-image: radial-gradient(var(--soft-pink) 10%, transparent 11%);
            background-size: 25px 25px;
            font-family: 'DungGeunMo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .window {
            width: 360px;
            background: var(--white);
            border: 4px solid #000;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
        }

        .title-bar {
            background: var(--dark-pink);
            padding: 5px 10px;
            color: var(--white);
            display: flex;
            justify-content: space-between;
            border-bottom: 4px solid #000;
            font-size: 12px;
        }

        /* 날씨 섹션 */
        .weather-area {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: #fff;
            border-bottom: 2px dashed #000;
        }

        .weather-item {
            text-align: center;
            font-size: 0.75rem;
            color: #333;
        }

        .weather-icon { font-size: 1.5rem; display: block; margin-bottom: 3px; }

        .content {
            padding: 15px;
            background: linear-gradient(to bottom, var(--soft-pink), var(--white));
        }

        /* 높이를 줄인 경로 카드 */
        .route-card {
            background: var(--white);
            border: 2px solid #000;
            padding: 8px;
            margin-bottom: 12px;
            text-align: center;
            line-height: 1.2;
        }

        .route-card h2 { margin: 0; font-size: 1rem; color: var(--dark-pink); }
        .route-arrow { font-size: 0.8rem; margin: 2px 0; }

        /* 컴팩트해진 버스 리스트 */
        .bus-item {
            background: var(--white);
            border: 2px solid #000;
            margin-bottom: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bus-no { font-size: 1.2rem; font-weight: bold; }
        
        .arrival-msg {
            font-size: 1rem;
            color: var(--dark-pink);
            animation: starlight 2.5s ease-in-out infinite;
        }

        @keyframes starlight {
            0%, 100% { opacity: 1; text-shadow: var(--starlight-glow); }
            50% { opacity: 0.3; text-shadow: none; }
        }

        .dest-min { font-size: 0.75rem; color: #666; text-align: right; }

        .status-bar {
            background: #eee;
            border-top: 3px solid #000;
            padding: 5px 10px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
        }

        #timer-bar { width: 50px; height: 10px; background: #ddd; border: 1px solid #000; display: inline-block; }
        #timer-fill { height: 100%; background: var(--main-pink); width: 100%; }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>BUS_WEATHER_DASHBOARD.SYS</span>
        <span>[×]</span>
    </div>

    <div class="weather-area">
        <div class="weather-item">
            <strong>범천동</strong>
            <span class="weather-icon">☀️</span>
            18°C / ☔ 10%
        </div>
        <div class="weather-item" style="border-left: 1px dotted #ccc; padding-left: 15px;">
            <strong>대연3동</strong>
            <span class="weather-icon">⛅</span>
            19°C / ☔ 20%
        </div>
    </div>

    <div class="content">
        <div class="route-card">
            <h2>범내골(05715) ➔ 경성대(07170)</h2>
        </div>

        <div id="bus-list">
            </div>
    </div>

    <div class="status-bar">
        <div>REFRESH: <span id="sec-text">15</span>s <div id="timer-bar"><div id="timer-fill"></div></div></div>
        <div id="clock">00:00:00</div>
    </div>
</div>

<script>
    // --- 설정 정보 ---
    const SERVICE_KEY = '발급받으신_키를_여기에_넣으세요'; 
    const ROUTE_DATA = { '83': 18, '108': 20, '83-1': 19 };

    let timeLeft = 15;

    async function updateData() {
        // 날씨 데이터와 버스 데이터를 API로 가져오는 로직이 들어갈 곳입니다.
        // 현재는 시뮬레이션 데이터를 뿌려줍니다.
        const busList = document.getElementById('bus-list');
        const mockData = [
            { no: '83', min: Math.floor(Math.random() * 5) + 2 },
            { no: '108', min: Math.floor(Math.random() * 10) + 5 },
            { no: '83-1', min: Math.floor(Math.random() * 8) + 3 }
        ];

        busList.innerHTML = '';
        mockData.sort((a,b) => a.min - b.min).forEach(bus => {
            const destTime = bus.min + ROUTE_DATA[bus.no];
            busList.innerHTML += `
                <div class="bus-item">
                    <div>
                        <div class="bus-no">${bus.no}</div>
                    </div>
                    <div style="text-align: right;">
                        <div class="arrival-msg">${bus.min}분 뒤 도착</div>
                        <div class="dest-min">경성대역 약 ${destTime}분 뒤</div>
                    </div>
                </div>
            `;
        });
        timeLeft = 15;
    }

    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString();
        
        timeLeft--;
        document.getElementById('sec-text').innerText = timeLeft;
        document.getElementById('timer-fill').style.width = (timeLeft / 15 * 100) + '%';
        
        if (timeLeft <= 0) updateData();
    }, 1000);

    updateData();
</script>
</body>
</html>
