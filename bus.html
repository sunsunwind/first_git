<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☆BUS_RAIN_FINAL☆</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/DungGeunMo.css">
    <style>
        :root {
            --main-pink: #ff85bc;
            --soft-pink: #ffe4f0;
            --dark-pink: #cf3a80;
            --white: #ffffff;
        }

        body {
            background-color: var(--main-pink);
            background-image: radial-gradient(var(--soft-pink) 10%, transparent 11%);
            background-size: 20px 20px;
            font-family: 'DungGeunMo', sans-serif;
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box;
        }

        .window { 
            width: 100%; max-width: 380px; 
            background: var(--white); border: 4px solid #000; 
            box-shadow: 8px 8px 0px rgba(0,0,0,0.2); 
        }

        .title-bar { background: var(--dark-pink); padding: 6px 10px; color: var(--white); display: flex; justify-content: space-between; border-bottom: 4px solid #000; font-size: 11px; }

        .weather-area { display: flex; background: #fff; border-bottom: 2px dashed #000; }
        .weather-col { flex: 1; padding: 12px 0; text-align: center; border-right: 1px dotted #000; }
        .weather-col:last-child { border-right: none; }
        .town-name { font-size: 0.85rem; background: var(--soft-pink); display: inline-block; padding: 2px 8px; margin-bottom: 6px; border: 1px solid #000; }

        .content { padding: 15px; background: linear-gradient(to bottom, var(--soft-pink), var(--white)); min-height: 250px; }
        .route-card { background: var(--white); border: 2px solid #000; padding: 8px; margin-bottom: 12px; text-align: center; }
        .route-card h2 { margin: 0; font-size: 0.9rem; color: var(--dark-pink); }

        .bus-item { background: var(--white); border: 2px solid #000; margin-bottom: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .bus-no { font-size: 1.2rem; font-weight: bold; }
        .arrival-msg { font-size: 1rem; color: var(--dark-pink); animation: starlight 2.5s infinite; }
        @keyframes starlight { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        .status-bar { background: #eee; border-top: 3px solid #000; padding: 8px 10px; font-size: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar"><span>RAIN_BUS_LIVE_V9.EXE</span><span>[X]</span></div>

    <div class="weather-area">
        <div class="weather-col">
            <div class="town-name">범천동</div>
            <div id="info-bc" style="font-size:0.75rem">연결 중..</div>
        </div>
        <div class="weather-col">
            <div class="town-name">대연3동</div>
            <div id="info-dy" style="font-size:0.75rem">연결 중..</div>
        </div>
    </div>

    <div class="content">
        <div class="route-card">
            <h2>범내골(05715) ➔ 경성대</h2>
        </div>
        <div id="bus-list">
            <div style="text-align:center; padding-top:40px; font-size:0.8rem; color:#888;">데이터를 불러오는 중...</div>
        </div>
    </div>

    <div class="status-bar">
        <div>REF: <span id="sec-text">15</span>s</div>
        <div id="clock">00:00:00</div>
    </div>
</div>

<script>
    // [설정] 본인의 정보를 정확히 입력하세요.
    const API_KEY = '3518be1c6727b63643d44c23d2eebc692431587fae6991a090313e7fcf97cac8'; // 버스/날씨 공용 (Encoding 키 권장)
    const GOOGLE_PROXY_URL = 'https://script.google.com/macros/s/AKfycbz14mZ2kYsnQweBW4E7ocabFDBhY3_HhwH0FsWqTlcCPgcw_FleOcvYl7tTGhX5UL1FCA/exec'; 
    const BSTOP_ID = '509870000'; // 범내골역 경성대 방면
    const TARGET_BUSES = ['83', '108', '83-1'];

    let timeLeft = 15;

    // 1. 날씨 시간 계산 (기상청 단기예보 업데이트 주기 맞춤)
    function getBaseTime() {
        const now = new Date();
        const hour = now.getHours();
        const min = now.getMinutes();
        const baseTimes = [2, 5, 8, 11, 14, 17, 20, 23];
        
        // 해당 시간대의 10분 이후부터 데이터가 안정적으로 생성됨
        let closest = baseTimes.filter(t => t <= hour).pop();
        if (hour === closest && min < 15) {
            closest = baseTimes[baseTimes.indexOf(closest) - 1];
        }
        if (!closest) closest = 23;
        return String(closest).padStart(2, '0') + "00";
    }

    // 2. 날씨 및 강수확률 가져오기
    async function fetchWeather(nx, ny, elementId) {
        const now = new Date();
        if (now.getHours() < 2) now.setDate(now.getDate() - 1);
        const baseDate = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
        const baseTime = getBaseTime();

        const url = `http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst?serviceKey=${API_KEY}&numOfRows=50&pageNo=1&base_date=${baseDate}&base_time=${baseTime}&nx=${nx}&ny=${ny}&_type=json`;
        
        try {
            const response = await fetch(`${GOOGLE_PROXY_URL}?url=${encodeURIComponent(url)}`);
            const data = await response.json();
            const items = data.response.body.items.item;
            
            const tmp = items.find(i => i.category === 'TMP').fcstValue;
            const pop = items.find(i => i.category === 'POP').fcstValue;
            
            document.getElementById(elementId).innerHTML = `☀️ ${tmp}°C / ☔ ${pop}%`;
        } catch (e) {
            document.getElementById(elementId).innerHTML = `연결 대기`;
        }
    }

    // 3. 버스 도착 정보 가져오기
    async function fetchBusData() {
        const busListContainer = document.getElementById('bus-list');
        const url = `http://apis.data.go.kr/6260000/BusanBIMS/stopArrByBstopid?serviceKey=${API_KEY}&bstopid=${BSTOP_ID}&_type=json`;

        try {
            const response = await fetch(`${GOOGLE_PROXY_URL}?url=${encodeURIComponent(url)}`);
            const data = await response.json();
            
            if (!data.response.body) throw new Error();

            const items = data.response.body.items.item;
            const busData = Array.isArray(items) ? items : (items ? [items] : []);
            const filtered = busData.filter(bus => TARGET_BUSES.includes(String(bus.lineNo)));
            
            busListContainer.innerHTML = '';
            if (filtered.length === 0) {
                busListContainer.innerHTML = '<div style="text-align:center; padding-top:40px; font-size:0.8rem;">운행 정보가 없습니다.</div>';
            } else {
                filtered.forEach(bus => {
                    const min = bus.min1;
                    busListContainer.innerHTML += `
                        <div class="bus-item">
                            <div class="bus-no">${bus.lineNo}</div>
                            <div style="text-align: right;">
                                <div class="arrival-msg">${min}분 뒤 도착</div>
                                <div style="font-size:0.7rem; color:#666;">경성대 약 ${parseInt(min)+18}분 뒤</div>
                            </div>
                        </div>`;
                });
            }
        } catch (e) {
            busListContainer.innerHTML = '<div style="text-align:center; font-size:0.7rem; padding-top:40px;">버스 연결 대기 중...</div>';
        }
        timeLeft = 15;
    }

    // 시계 및 타이머 루프
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        timeLeft--;
        document.getElementById('sec-text').innerText = (timeLeft < 0) ? 0 : timeLeft;
        if (timeLeft === 0) fetchBusData();
    }, 1000);

    // 초기 실행
    fetchWeather(97, 75, 'info-bc');
    fetchWeather(98, 75, 'info-dy');
    fetchBusData();
</script>
</body>
</html>
