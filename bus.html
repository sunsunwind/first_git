<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUS + WEATHER FINAL</title>

<style>
body { background:#ff85bc; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
.box { width:360px; background:#fff; border:3px solid #000; padding:10px;}
.bus { border:1px solid #000; padding:8px; margin-bottom:6px;}
</style>
</head>

<body>
<div class="box">
  <h3>🚌 BUS + 🌤 WEATHER</h3>

  <div>범천동: <span id="bc">--</span></div>
  <div>대연3동: <span id="dy">--</span></div>

  <hr>
  <div id="bus">불러오는 중...</div>

  <hr>
  <div>⏱ <span id="sec">15</span>s</div>
  <div id="clock"></div>
</div>

<script>
const API_KEY = '3518be1c6727b63643d44c23d2eebc692431587fae6991a090313e7fcf97cac8';
const PROXY = 'https://script.google.com/macros/s/AKfycbwCa2Iaf0UV5zx3LTxZceUYNTnHcSMhhKdcEPBbVuSCwiBhjCHWMIEw4N1NzyaYkERlwQ/exec';

const BSTOP_ID = '509870000';
const TARGET = ['83','108','83-1'];

let t = 15;

// ✅ base_time 자동 계산
function getBaseTime() {
  const now = new Date();
  const hour = now.getHours();

  const times = [2,5,8,11,14,17,20,23];
  let base = '2300';

  for (let i = times.length - 1; i >= 0; i--) {
    if (hour >= times[i]) {
      base = String(times[i]).padStart(2,'0') + '00';
      break;
    }
  }
  return base;
}

// ✅ fetch 공통
async function call(api) {
  const res = await fetch(PROXY + '?url=' + encodeURIComponent(api));
  return await res.json();
}

// ✅ 날씨
async function weather(nx, ny, el) {
  try {
    const date = new Date().toISOString().slice(0,10).replace(/-/g,'');
    const time = getBaseTime();

    const url = `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst?serviceKey=${encodeURIComponent(API_KEY)}&numOfRows=60&pageNo=1&base_date=${date}&base_time=${time}&nx=${nx}&ny=${ny}&_type=json`;

    const data = await call(url);
    const items = data.response.body.items.item;

    const tmp = items.find(i=>i.category==='TMP')?.fcstValue ?? '--';
    const pop = items.find(i=>i.category==='POP')?.fcstValue ?? '--';

    document.getElementById(el).innerText = `${tmp}°C / ${pop}%`;
  } catch(e) {
    document.getElementById(el).innerText = '에러';
  }
}

// ✅ 버스
async function bus() {
  try {
    const url = `https://apis.data.go.kr/6260000/BusanBIMS/stopArrByBstopid?serviceKey=${encodeURIComponent(API_KEY)}&bstopid=${BSTOP_ID}&_type=json`;

    const data = await call(url);
    let items = data.response?.body?.items?.item;

    if (!items) throw 'no data';
    if (!Array.isArray(items)) items = [items];

    const list = items.filter(b => TARGET.includes(String(b.lineNo)));

    const el = document.getElementById('bus');

    if (list.length === 0) {
      el.innerHTML = '버스 없음';
      return;
    }

    el.innerHTML = '';
    list.forEach(b=>{
      el.innerHTML += `<div class="bus">${b.lineNo} → ${b.min1}분</div>`;
    });

  } catch(e) {
    document.getElementById('bus').innerText = '에러';
  }
}

// ✅ 전체 업데이트
function update() {
  weather(97,75,'bc');
  weather(98,75,'dy');
  bus();
}

// ✅ 타이머
setInterval(()=>{
  document.getElementById('clock').innerText = new Date().toLocaleTimeString();

  t--;
  if(t<=0){
    t=15;
    update();
  }
  document.getElementById('sec').innerText = t;

},1000);

update();
</script>
</body>
</html>
