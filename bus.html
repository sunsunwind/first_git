<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☆BUS_N_RAIN_LIVE☆</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/DungGeunMo.css">
    <style>
        /* (기존 핑크 디자인 스타일 동일) */
        :root { --main-pink: #ff85bc; --soft-pink: #ffe4f0; --dark-pink: #cf3a80; --white: #ffffff; }
        body { background-color: var(--main-pink); font-family: 'DungGeunMo'; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box; }
        .window { width: 100%; max-width: 380px; background: var(--white); border: 4px solid #000; box-shadow: 8px 8px 0px rgba(0,0,0,0.2); }
        .title-bar { background: var(--dark-pink); padding: 6px 10px; color: var(--white); display: flex; justify-content: space-between; border-bottom: 4px solid #000; font-size: 11px; }
        .weather-area { display: flex; background: #fff; border-bottom: 2px dashed #000; }
        .weather-col { flex: 1; padding: 12px 0; text-align: center; border-right: 1px dotted #000; }
        .town-name { font-size: 0.85rem; background: var(--soft-pink); display: inline-block; padding: 2px 8px; margin-bottom: 6px; border: 1px solid #000; }
        .content { padding: 15px; background: linear-gradient(to bottom, var(--soft-pink), var(--white)); min-height: 250px; }
        .bus-item { background: var(--white); border: 2px solid #000; margin-bottom: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .arrival-msg { font-size: 1rem; color: var(--dark-pink); animation: starlight 2.5s infinite; }
        @keyframes starlight { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .status-bar { background: #eee; border-top: 3px solid #000; padding: 8px 10px; font-size: 10px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar"><span>RAIN_PROBABILITY_LIVE.EXE</span><span>[X]</span></div>
    <div class="weather-area">
        <div class="weather-col" id="weather-bc">
            <div class="town-name">범천동</div>
            <div id="info-bc" style="font-size:0.75rem">연결 중..</div>
        </div>
        <div class="weather-col" id="weather-dy">
            <div class="town-name">대연3동</div>
            <div id="info-dy" style="font-size:0.75rem">연결 중..</div>
        </div>
    </div>
    <div class="content">
        <div id="bus-list"><div style="text-align:center; padding-top:40px; font-size:0.8rem;">데이터 동기화 중...</div></div>
    </div>
    <div class="status-bar">
        <div>REF: <span id="sec-text">15</span>s</div>
        <div id="clock">00:00:00</div>
    </div>
</div>

<script>
    // [설정] 본인의 정보
    const API_KEY = '3518be1c6727b63643d44c23d2eebc692431587fae6991a090313e7fcf97cac8'; // 버스/날씨 공용 키
    const GOOGLE_PROXY_URL = 'https://script.google.com/macros/s/AKfycbz14mZ2kYsnQweBW4E7ocabFDBhY3_HhwH0FsWqTlcCPgcw_FleOcvYl7tTGhX5UL1FCA/exec';
    const BSTOP_ID = '509870000'; 
    const TARGET_BUSES = ['83', '108', '83-1'];

    let timeLeft = 15;

    // 1. 날씨 데이터 가져오기 (강수확률 POP 포함)
    async function fetchWeather(nx, ny, elementId) {
        const now = new Date();
        const baseDate = now.toISOString().slice(0,10).replace(/-/g, "");
        // 단기예보는 정해진 시간에만 업데이트되므로 안전하게 0800 데이터 사용
        const weatherUrl = `http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst?serviceKey=${API_KEY}&numOfRows=100&pageNo=1&base_date=${baseDate}&base_time=0800&nx=${nx}&ny=${ny}&_type=json`;
        
        try {
            const response = await fetch(`${GOOGLE_PROXY_URL}?url=${encodeURIComponent(weatherUrl)}`);
            const data = await response.json();
            const items = data.response.body.items.item;
            
            // 기온(TMP)과 강수확률(POP) 찾기
            const tmp = items.find(i => i.category === 'TMP').fcstValue;
            const pop = items.find(i => i.category === 'POP').fcstValue;
            
            document.getElementById(elementId).innerHTML = `☀️ ${tmp}°C / ☔ ${pop}%`;
        } catch (e) {
            document.getElementById(elementId).innerHTML = `연결 대기`;
        }
    }

    // 2. 버스 데이터 가져오기
    async function fetchBusData() {
        const busListContainer = document.getElementById('bus-list');
        const apiAddr = `http://apis.data.go.kr/6260000/BusanBIMS/stopArrByBstopid?serviceKey=${API_KEY}&bstopid=${BSTOP_ID}&_type=json`;
        
        try {
            const response = await fetch(`${GOOGLE_PROXY_URL}?url=${encodeURIComponent(apiAddr)}`);
            const data = await response.json();
            const items = data.response.body.items.item;
            const busData = Array.isArray(items) ? items : (items ? [items] : []);
            const filtered = busData.filter(bus => TARGET_BUSES.includes(String(bus.lineNo)));
            
            busListContainer.innerHTML = '';
            if (filtered.length === 0) {
                busListContainer.innerHTML = '<div style="text-align:center; padding-top:40px;">버스 정보 없음</div>';
            } else {
                filtered.forEach(bus => {
                    busListContainer.innerHTML += `
                        <div class="bus-item">
                            <div style="font-weight:bold; font-size:1.2rem;">${bus.lineNo}</div>
                            <div style="text-align: right;">
                                <div class="arrival-msg">${bus.min1}분 뒤 도착</div>
                                <div style="font-size:0.7rem; color:#666;">경성대 약 ${parseInt(bus.min1)+18}분 뒤</div>
                            </div>
                        </div>`;
                });
            }
        } catch (e) {
            busListContainer.innerHTML = '<div style="text-align:center; font-size:0.7rem; padding-top:40px;">연결 시도 중...</div>';
        }
        timeLeft = 15;
    }

    // 시계 및 루프
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        timeLeft--;
        document.getElementById('sec-text').innerText = (timeLeft < 0) ? 0 : timeLeft;
        if (timeLeft === 0) fetchBusData();
    }, 1000);

    // 초기 실행
    fetchWeather(97, 75, 'info-bc'); // 범천동 좌표
    fetchWeather(98, 75, 'info-dy'); // 대연3동 좌표
    fetchBusData();
</script>
</body>
</html>
