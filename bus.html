<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☆BUS_LIVE_SYSTEM☆</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/DungGeunMo.css">
    <style>
        :root {
            --main-pink: #ff85bc;
            --soft-pink: #ffe4f0;
            --dark-pink: #cf3a80;
            --white: #ffffff;
            --starlight-glow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        body {
            background-color: var(--main-pink);
            background-image: radial-gradient(var(--soft-pink) 10%, transparent 11%);
            background-size: 25px 25px;
            font-family: 'DungGeunMo', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }

        .window { width: 370px; background: var(--white); border: 4px solid #000; box-shadow: 10px 10px 0px rgba(0,0,0,0.2); }
        .title-bar { background: var(--dark-pink); padding: 5px 10px; color: var(--white); display: flex; justify-content: space-between; border-bottom: 4px solid #000; font-size: 12px; }

        .weather-area { display: flex; background: #fff; border-bottom: 2px dashed #000; }
        .weather-col { flex: 1; padding: 10px 5px; text-align: center; border-right: 1px dotted #000; }
        .weather-col:last-child { border-right: none; }
        .town-name { font-size: 0.9rem; background: var(--soft-pink); display: inline-block; padding: 2px 8px; margin-bottom: 8px; border: 1px solid #000; }
        .weather-grid { display: flex; justify-content: space-around; font-size: 0.7rem; }
        .weather-slot { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .weather-icon { font-size: 1.1rem; }

        .content { padding: 15px; background: linear-gradient(to bottom, var(--soft-pink), var(--white)); min-height: 250px; }
        .route-card { background: var(--white); border: 2px solid #000; padding: 6px; margin-bottom: 12px; text-align: center; }
        .route-card h2 { margin: 0; font-size: 0.95rem; color: var(--dark-pink); }

        .bus-item { background: var(--white); border: 2px solid #000; margin-bottom: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .bus-no { font-size: 1.2rem; font-weight: bold; }
        .arrival-msg { font-size: 1rem; color: var(--dark-pink); animation: starlight 2.5s ease-in-out infinite; }
        @keyframes starlight { 0%, 100% { opacity: 1; text-shadow: var(--starlight-glow); } 50% { opacity: 0.3; text-shadow: none; } }
        .dest-min { font-size: 0.75rem; color: #666; text-align: right; }

        .status-bar { background: #eee; border-top: 3px solid #000; padding: 5px 10px; font-size: 11px; display: flex; justify-content: space-between; }
        #timer-bar { width: 50px; height: 10px; background: #ddd; border: 1px solid #000; display: inline-block; }
        #timer-fill { height: 100%; background: var(--main-pink); width: 100%; transition: width 1s linear; }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>LIVE_BUS_CONNECT.EXE</span>
        <span>[×]</span>
    </div>

    <div class="weather-area">
        <div class="weather-col">
            <div class="town-name">범천동</div>
            <div class="weather-grid">
                <div class="weather-slot"><span style="font-size:0.6rem">NOW</span><span class="weather-icon">☀️</span><span>18° 10%</span></div>
                <div class="weather-slot"><span style="font-size:0.6rem">20:00</span><span class="weather-icon">🌙</span><span>14° 0%</span></div>
            </div>
        </div>
        <div class="weather-col">
            <div class="town-name">대연3동</div>
            <div class="weather-grid">
                <div class="weather-slot"><span style="font-size:0.6rem">NOW</span><span class="weather-icon">⛅</span><span>19° 20%</span></div>
                <div class="weather-slot"><span style="font-size:0.6rem">20:00</span><span class="weather-icon">☁️</span><span>15° 10%</span></div>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="route-card">
            <h2>범내골(05715) ➔ 경성대(07170)</h2>
        </div>
        <div id="bus-list">
            <div style="text-align:center; padding-top:50px;">데이터 연결 중...</div>
        </div>
    </div>

    <div class="status-bar">
        <div>REFRESH: <span id="sec-text">15</span>s <div id="timer-bar"><div id="timer-fill"></div></div></div>
        <div id="clock">00:00:00</div>
    </div>
</div>

<script>
    // [설정] 발급받으신 API 키를 여기에 넣으세요
    const SERVICE_KEY = '3518be1c6727b63643d44c23d2eebc692431587fae6991a090313e7fcf97cac8'; 
    const TARGET_BUSES = ['83', '108', '83-1'];
    const BSTOP_ID = '505710000'; // 범내골역(05715)의 시스템 내부 ID
    
    // 범내골 -> 경성대역 예상 소요 정류장 시간(분)
    const OFFSET_MAP = { '83': 18, '108': 20, '83-1': 19 };

    let timeLeft = 15;

    async function fetchBusData() {
        const busListContainer = document.getElementById('bus-list');
        
        try {
            // 부산광역시 부산버스정보시스템 - 정류소별 도착정보 조회 API 주소
            const url = `http://apis.data.go.kr/6260000/BusanBIMS/stopArrByStopid?serviceKey=${SERVICE_KEY}&bstopid=${BSTOP_ID}&_type=json`;

            const response = await fetch(url);
            const result = await response.json();
            
            // 데이터 추출 (API 응답 구조에 따라 경로가 달라질 수 있음)
            const items = result.response.body.items.item;
            const busData = Array.isArray(items) ? items : [items];

            // 필터링 및 렌더링
            const filtered = busData.filter(bus => TARGET_BUSES.includes(String(bus.lineNo)));
            
            if (filtered.length === 0) {
                busListContainer.innerHTML = '<div style="text-align:center; font-size:0.8rem;">운행 중인 버스가 없습니다.</div>';
                return;
            }

            busListContainer.innerHTML = '';
            filtered.forEach(bus => {
                const min = bus.min1; // 첫 번째 도착 예정 시간(분)
                const busNo = bus.lineNo;
                const destTime = min + (OFFSET_MAP[busNo] || 0);

                busListContainer.innerHTML += `
                    <div class="bus-item">
                        <div class="bus-no">${busNo}</div>
                        <div style="text-align: right;">
                            <div class="arrival-msg">${min}분 뒤 도착</div>
                            <div class="dest-min">경성대역 약 ${destTime}분 뒤</div>
                        </div>
                    </div>
                `;
            });

        } catch (error) {
            console.error("API 호출 에러:", error);
            busListContainer.innerHTML = '<div style="text-align:center; font-size:0.7rem; color:red;">API 연결 실패<br>(CORS 또는 키 확인 필요)</div>';
        }
        timeLeft = 15;
    }

    // 시간 및 타이머 업데이트 루프
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        timeLeft--;
        if (timeLeft < 0) timeLeft = 0;
        
        document.getElementById('sec-text').innerText = timeLeft;
        document.getElementById('timer-fill').style.width = (timeLeft / 15 * 100) + '%';
        
        if (timeLeft === 0) fetchBusData();
    }, 1000);

    // 초기 실행
    fetchBusData();
</script>
</body>
</html>
