<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☆BUS_STAR_LIGHT☆</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/DungGeunMo.css">
    <style>
        :root {
            --main-pink: #ff85bc;
            --soft-pink: #ffe4f0;
            --dark-pink: #cf3a80;
            --white: #ffffff;
        }

        body {
            background-color: var(--main-pink);
            background-image: radial-gradient(var(--soft-pink) 10%, transparent 11%);
            background-size: 25px 25px;
            font-family: 'DungGeunMo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 윈도우 프레임 */
        .window {
            width: 350px;
            background: var(--white);
            border: 4px solid #000;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.15);
        }

        .title-bar {
            background: var(--dark-pink);
            padding: 8px 10px;
            color: var(--white);
            display: flex;
            justify-content: space-between;
            border-bottom: 4px solid #000;
            font-size: 14px;
        }

        .title-bar-btns span {
            border: 2px solid #000;
            padding: 0 4px;
            margin-left: 2px;
            background: #eee;
            color: #000;
            font-weight: bold;
        }

        .content {
            padding: 20px;
            background: linear-gradient(to bottom, var(--soft-pink), var(--white));
        }

        /* 경로 박스 */
        .route-card {
            background: var(--white);
            border: 2px solid #000;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .route-card h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--dark-pink);
        }

        .route-arrow {
            margin: 5px 0;
            font-size: 1.2rem;
        }

        /* 버스 정보 아이템 */
        .bus-item {
            background: var(--white);
            border: 2px solid #000;
            margin-bottom: 15px;
            padding: 12px;
            position: relative;
        }

        .bus-no {
            font-size: 1.4rem;
            color: #333;
            border-bottom: 2px dotted var(--main-pink);
            display: inline-block;
            margin-bottom: 8px;
        }

        /* 별빛처럼 흐릿해졌다 선명해지는 효과 */
        .arrival-msg {
            font-size: 1.1rem;
            color: var(--dark-pink);
            font-weight: bold;
            animation: starlight 2.5s ease-in-out infinite;
        }

        @keyframes starlight {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 2px var(--main-pink)); }
            50% { opacity: 0.3; filter: drop-shadow(0 0 8px var(--white)); }
        }

        .dest-info {
            font-size: 0.85rem;
            margin-top: 10px;
            color: #666;
        }

        /* 상태바 */
        .status-bar {
            background: #f0f0f0;
            border-top: 4px solid #000;
            padding: 8px 10px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        #timer-bar {
            width: 60px;
            height: 12px;
            background: #ddd;
            border: 1px solid #000;
            display: inline-block;
            vertical-align: middle;
        }

        #timer-fill {
            height: 100%;
            background: var(--main-pink);
            width: 100%;
        }

        .deco { position: absolute; font-size: 25px; pointer-events: none; }
    </style>
</head>
<body>

<div class="deco" style="top: 50px; left: 50px;">✧</div>
<div class="deco" style="bottom: 50px; right: 50px;">✧</div>

<div class="window">
    <div class="title-bar">
        <span>STAR_BUS_V2.EXE</span>
        <div class="title-bar-btns"><span>_</span><span>×</span></div>
    </div>

    <div class="content">
        <div class="route-card">
            <h2>범내골(05715)</h2>
            <div class="route-arrow">▼</div>
            <h2>경성대부경대(07170)</h2>
        </div>

        <div id="bus-list"></div>
    </div>

    <div class="status-bar">
        <div>REFRESH: <span id="sec-text">15</span>s <div id="timer-bar"><div id="timer-fill"></div></div></div>
        <div id="clock">00:00:00</div>
    </div>
</div>

<script>
    const ROUTE_DATA = {
        '83': { offset: 18 },
        '108': { offset: 20 },
        '83-1': { offset: 19 }
    };

    let timeLeft = 15;

    function updateClock() {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }

    async function fetchBusInfo() {
        const listContainer = document.getElementById('bus-list');
        
        // 시뮬레이션 데이터 (실제 API 연동 시 fetch 결과가 들어올 자리)
        const mockData = [
            { no: '83', min: Math.floor(Math.random() * 8) + 1 },
            { no: '108', min: Math.floor(Math.random() * 12) + 5 },
            { no: '83-1', min: Math.floor(Math.random() * 10) + 2 }
        ];

        listContainer.innerHTML = '';
        mockData.sort((a, b) => a.min - b.min).forEach(bus => {
            const destTime = bus.min + ROUTE_DATA[bus.no].offset;
            listContainer.innerHTML += `
                <div class="bus-item">
                    <div class="bus-no">NO.${bus.no}</div>
                    <div class="arrival-msg">${bus.min}분 뒤 도착 예정</div>
                    <div class="dest-info">경성대역까지 약 ${destTime}분 소요</div>
                </div>
            `;
        });
        timeLeft = 15;
    }

    setInterval(() => {
        updateClock();
        timeLeft--;
        document.getElementById('sec-text').innerText = timeLeft;
        document.getElementById('timer-fill').style.width = (timeLeft / 15 * 100) + '%';
        if (timeLeft <= 0) fetchBusInfo();
    }, 1000);

    fetchBusInfo();
    updateClock();
</script>

</body>
</html>
