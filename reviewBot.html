<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>네이버 리뷰 작성 도우미</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #e8f5e9;
        padding: 20px;
    }

    .container {
        max-width: 600px;
        margin: auto;
        background: #ffffff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        border-top: 8px solid #03c75a;
    }

    h1 {
        text-align: center;
        color: #03c75a;
    }

    .section {
        margin-top: 20px;
    }

    button {
        margin: 5px 5px 0 0;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #03c75a;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background: #02b351;
    }

    textarea {
        width: 100%;
        height: 150px;
        margin-top: 10px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        resize: none;
    }

    .copy-btn {
        background: #2e7d32;
        margin-top: 10px;
        width: 100%;
    }

    .link-btn {
        background: #1b5e20;
        margin-top: 20px;
        width: 100%;
        font-size: 16px;
        padding: 12px;
    }
</style>

</head>
<body>

<div class="container">
    <h1>리뷰 작성 도우미</h1>

    <div class="section">
        <b>🟢 시작 문장</b><br>
        <button onclick="addText('최근에 방문했는데 정말 만족스러웠어요. ')">만족</button>
        <button onclick="addText('지인 추천으로 방문했는데 기대 이상이었어요. ')">추천</button>
        <button onclick="addText('우연히 들렀는데 너무 좋았어요. ')">우연</button>
    </div>

    <div class="section">
        <b>🟢 장점 선택</b><br>
        <button onclick="addText('직원분들이 정말 친절했어요. ')">친절</button>
        <button onclick="addText('분위기가 너무 좋았어요. ')">분위기</button>
        <button onclick="addText('가성비가 뛰어나요. ')">가성비</button>
        <button onclick="addText('음식이 정말 맛있어요. ')">맛</button>
        <button onclick="addText('매장이 깔끔하고 좋아요. ')">청결</button>
    </div>

    <div class="section">
        <b>🟢 마무리</b><br>
        <button onclick="addText('다음에도 꼭 다시 방문할게요! ')">재방문</button>
        <button onclick="addText('주변에 추천하고 싶어요! ')">추천하기</button>
        <button onclick="addText('정말 만족스러운 경험이었어요 😊 ')">만족</button>
    </div>

    <div class="section">
        <b>📝 작성 내용</b>
        <textarea id="review"></textarea>
        <button class="copy-btn" onclick="copyText()">📋 복사하기</button>
    </div>

    <button class="link-btn" onclick="goToNaver()">👉 네이버 리뷰 작성하러 가기</button>
</div>

<script>
function addText(text) {
    const textarea = document.getElementById('review');
    textarea.value += text;
}

function copyText() {
    const textarea = document.getElementById('review');
    textarea.select();
    document.execCommand('copy');
    alert('복사되었습니다!');
}

function goToNaver() {
    window.open('https://m.place.naver.com/my/review?tab=review', '_blank');
}
</script>

</body>
</html>
