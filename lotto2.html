<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로또 번호 추출기</title>
    <style>
        /* CSS는 여기에 작성하거나 별도의 파일로 분리할 수 있습니다 */
        .lotto-ball {
            display: inline-block;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #ffcc00; /* 임시 배경색 */
            color: black;
            text-align: center;
            line-height: 50px;
            font-size: 20px;
            font-weight: bold;
            margin: 5px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        }
        #lotto-result {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>🍀 로또 번호 추출기</h1>
    <button onclick="generateLottoNumbers()">번호 추출</button>
    <div id="lotto-result">
        </div>

    <script>
        // JavaScript는 여기에 작성합니다
        function generateLottoNumbers() {
            const numbers = [];
            // 1부터 45까지의 숫자 배열 생성
            let fullNumbers = Array.from({length: 45}, (_, i) => i + 1);

            // 중복 없이 6개의 숫자 추출
            for (let i = 0; i < 6; i++) {
                // 배열에서 랜덤 인덱스 선택
                const randomIndex = Math.floor(Math.random() * fullNumbers.length);
                // 선택된 번호를 결과 배열에 추가
                const selectedNumber = fullNumbers.splice(randomIndex, 1)[0];
                numbers.push(selectedNumber);
            }

            // 오름차순 정렬
            numbers.sort((a, b) => a - b);

            // HTML에 결과 표시
            displayLottoNumbers(numbers);
        }

        function displayLottoNumbers(numbers) {
            const resultDiv = document.getElementById('lotto-result');
            resultDiv.innerHTML = ''; // 기존 결과 초기화

            numbers.forEach(number => {
                const ball = document.createElement('div');
                ball.classList.add('lotto-ball');
                ball.textContent = number;
                
                // 번호에 따라 공 색상 변경 (선택 사항)
                let color;
                if (number <= 10) color = '#fbc400';       // 노랑
                else if (number <= 20) color = '#69c8f2';  // 파랑
                else if (number <= 30) color = '#ff7272';  // 빨강
                else if (number <= 40) color = '#aaa';     // 회색
                else color = '#b0d840';                    // 초록
                
                ball.style.backgroundColor = color;
                
                resultDiv.appendChild(ball);
            });
        }
    </script>
</body>
</html>
