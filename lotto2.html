<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>API 예시</title>
</head>
<body>
  <h1>현재 날씨</h1>
  <p id="weather">불러오는 중...</p>

  <script>
    // 예: OpenWeatherMap API 사용
    const apiKey = "YOUR_API_KEY";
    const city = "Seoul";
    const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&lang=kr&units=metric`;

    fetch(url)
      .then(res => res.json())
      .then(data => {
        document.getElementById("weather").textContent = 
          `${data.name}의 온도: ${data.main.temp}°C`;
      })
      .catch(err => {
        document.getElementById("weather").textContent = "API 호출 실패 😢";
        console.error(err);
      });
  </script>
</body>
</html>
