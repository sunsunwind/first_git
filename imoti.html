<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>이모지 복사 페이지</title>
<style>
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
    background:#0f1724;
    color:#e6eef6;
    padding:16px;
  }
  h1{font-size:1.2rem;margin:0;}
  .sub{color:#9aa4b2;font-size:0.9rem;margin:4px 0 16px 0;}
  input,select,textarea,button{
    font-family:inherit;
  }
  input[type="search"],textarea{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.05);
    color:inherit;
    font-size:1rem;
    outline:none;
  }
  textarea{height:70px;resize:none;margin-top:8px;}
  button{
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.05);
    color:inherit;
    cursor:pointer;
    padding:8px 12px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:16px;
  }
  @media(min-width:600px){.grid{grid-template-columns:repeat(6,1fr)}}
  .card{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.05);
    border-radius:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
  }
  .emoji{font-size:1.6rem;cursor:pointer;}
  .label{flex:1;padding-left:8px;color:#9aa4b2;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:#222;padding:10px 16px;border-radius:20px;
    display:none;color:#fff;z-index:9999;
  }
</style>
</head>
<body>
<h1>이모지 복사 (한국어 검색 지원)</h1>
<p class="sub">이모지를 탭하거나 [복사] 버튼을 눌러 복사하세요.</p>

<!-- 검색창 -->
<input id="search" type="search" placeholder="검색 (예: 하트, 웃는, 음식, 강아지, love 등)" />

<!-- 텍스트 입력 + 복사 -->
<textarea id="textArea" placeholder="복사한 이모지나 직접 입력할 내용을 여기에 붙여넣으세요."></textarea>
<div style="margin-top:8px;display:flex;justify-content:flex-end;">
  <button id="copyText">텍스트 복사</button>
</div>

<div id="grid" class="grid"></div>
<div id="toast" class="toast"></div>

<script>
const EMOJIS = [
  // 하트/감정 (상단 우선)
  {e:"❤️", label:"red heart", ko:"하트 사랑", cat:"heart"},
  {e:"🧡", label:"orange heart", ko:"주황 하트", cat:"heart"},
  {e:"💛", label:"yellow heart", ko:"노랑 하트", cat:"heart"},
  {e:"💚", label:"green heart", ko:"초록 하트", cat:"heart"},
  {e:"💙", label:"blue heart", ko:"파랑 하트", cat:"heart"},
  {e:"💜", label:"purple heart", ko:"보라 하트", cat:"heart"},
  {e:"🤍", label:"white heart", ko:"하얀 하트", cat:"heart"},
  {e:"🖤", label:"black heart", ko:"검은 하트", cat:"heart"},
  {e:"💖", label:"sparkling heart", ko:"반짝 하트", cat:"heart"},
  {e:"💞", label:"revolving hearts", ko:"돌아가는 하트", cat:"heart"},

  // 음식/음료 (상단 우선)
  {e:"🍕", label:"pizza", ko:"피자 음식", cat:"food"},
  {e:"🍔", label:"burger", ko:"햄버거 음식", cat:"food"},
  {e:"🍟", label:"fries", ko:"감자튀김 음식", cat:"food"},
  {e:"🍜", label:"ramen", ko:"라면 국수", cat:"food"},
  {e:"🍣", label:"sushi", ko:"초밥 음식", cat:"food"},
  {e:"🍩", label:"donut", ko:"도넛 음식", cat:"food"},
  {e:"🍪", label:"cookie", ko:"쿠키 음식", cat:"food"},
  {e:"🍓", label:"strawberry", ko:"딸기 음식", cat:"food"},
  {e:"🍑", label:"peach", ko:"복숭아 음식", cat:"food"},
  {e:"🍀", label:"four leaf clover", ko:"행운 클로버", cat:"nature"},

  // 표정/사람
  {e:"😀", label:"grinning face", ko:"웃는 얼굴", cat:"smile"},
  {e:"🥹", label:"holding back tears", ko:"울컥 눈물", cat:"smile"},
  {e:"😂", label:"tears of joy", ko:"웃음 눈물", cat:"smile"},
  {e:"😊", label:"smiling face", ko:"웃는 얼굴 미소", cat:"smile"},
  {e:"😎", label:"sunglasses", ko:"선글라스 멋짐", cat:"smile"},
  {e:"🤔", label:"thinking", ko:"생각 궁금", cat:"smile"},
  {e:"🤗", label:"hug", ko:"포옹 안아줌", cat:"smile"},
  {e:"😘", label:"kiss", ko:"키스 뽀뽀", cat:"smile"},
  {e:"😍", label:"heart eyes", ko:"하트 눈 사랑", cat:"smile"},

  // 동물
  {e:"🐶", label:"dog", ko:"강아지", cat:"animal"},
  {e:"🐱", label:"cat", ko:"고양이", cat:"animal"},
  {e:"🐻", label:"bear", ko:"곰", cat:"animal"},
  {e:"🐰", label:"rabbit", ko:"토끼", cat:"animal"},
  {e:"🐼", label:"panda", ko:"판다", cat:"animal"},

  // 기타
  {e:"✨", label:"sparkles", ko:"반짝임", cat:"object"},
  {e:"🎉", label:"party", ko:"축하 파티", cat:"object"},
  {e:"💡", label:"idea", ko:"아이디어 전구", cat:"object"},
  {e:"📱", label:"phone", ko:"휴대폰", cat:"object"},
  {e:"✅", label:"check", ko:"체크 완료", cat:"object"},
];

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const toast = document.getElementById("toast");
const textArea = document.getElementById("textArea");
const copyTextBtn = document.getElementById("copyText");

function showToast(msg){
  toast.textContent = msg;
  toast.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toast.style.display="none",1500);
}

function copyToClipboard(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>showToast("복사됨: "+text));
  } else {
    const ta=document.createElement("textarea");
    ta.value=text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    showToast("복사됨: "+text);
  }
}

function buildCard(item){
  const div=document.createElement("div");
  div.className="card";
  const left=document.createElement("div");
  left.style.display="flex";left.style.alignItems="center";
  const em=document.createElement("div");
  em.className="emoji";em.textContent=item.e;
  em.addEventListener("click",()=>copyToClipboard(item.e));
  const lbl=document.createElement("div");
  lbl.className="label";lbl.textContent=item.ko||item.label;
  left.appendChild(em);left.appendChild(lbl);
  const btn=document.createElement("button");
  btn.textContent="복사";
  btn.addEventListener("click",()=>copyToClipboard(item.e));
  div.appendChild(left);div.appendChild(btn);
  return div;
}

function render(){
  const q=search.value.trim().toLowerCase();
  grid.innerHTML="";
  EMOJIS.forEach(item=>{
    if(!q || item.label.toLowerCase().includes(q) || (item.ko&&item.ko.includes(q)) || item.e.includes(q)){
      grid.appendChild(buildCard(item));
    }
  });
  if(!grid.children.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#888;padding:20px;">검색 결과 없음</div>';
  }
}

search.addEventListener("input",render);
render();

copyTextBtn.addEventListener("click",()=>{
  const val=textArea.value.trim();
  if(!val) return showToast("복사할 내용이 없습니다");
  copyToClipboard(val);
});
</script>
</body>
</html>
