<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>통화 변환</title>
<style>
  body {
    font-family: 'Pretendard', sans-serif;
    background: #f8f9fa;
    padding: 30px;
  }

  .section {
    background: #fff;
    border-radius: 12px;
    padding: 20px 30px;
    margin-bottom: 30px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.05);
  }

  h2 {
    color: #333;
    margin-bottom: 15px;
  }

  /* 결과 표시 스타일 (강조 + 형광펜 효과) */
  .result {
    font-size: 3rem;
    font-weight: 800;
    display: inline-block;
    background: linear-gradient(90deg, #fff89a 0%, #fff79a 100%);
    border-radius: 8px;
    padding: 8px 14px;
    transition: all 0.4s ease;
  }

  /* 값이 바뀔 때 애니메이션 효과 */
  .highlight {
    animation: pop 0.6s ease;
    background: linear-gradient(90deg, #ffe55c 0%, #fff89a 100%);
    transform: scale(1.1);
    box-shadow: 0 0 10px rgba(255, 230, 90, 0.7);
  }

  @keyframes pop {
    0% { transform: scale(1); background: #fff89a; }
    50% { transform: scale(1.2); background: #ffe55c; }
    100% { transform: scale(1); background: #fff89a; }
  }

  .input-row {
    margin-bottom: 15px;
  }

  input {
    padding: 5px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
  }

  button {
    padding: 5px 10px;
    margin-left: 10px;
    border: none;
    border-radius: 6px;
    background: #007bff;
    color: white;
    cursor: pointer;
  }

  button:hover {
    background: #0056b3;
  }
</style>
</head>
<body>

<!-- 💵 달러 → 원화 -->
<div class="section">
  <h2>💵 달러 → 원화</h2>
  <div class="input-row">
    <input type="number" id="usdInput" placeholder="달러 입력"> USD
    <button onclick="convertToKRW('usd')">변환</button>
  </div>
  <div>결과: <span id="usdResult" class="result">0 원</span></div>
</div>

<!-- 💴 엔화 → 원화 -->
<div class="section">
  <h2>💴 엔화 → 원화</h2>
  <div class="input-row">
    <input type="number" id="jpyInput" placeholder="엔화 입력"> JPY
    <button onclick="convertToKRW('jpy')">변환</button>
  </div>
  <div>결과: <span id="jpyResult" class="result">0 원</span></div>
</div>

<!-- 💰 바트 → 원화 -->
<div class="section">
  <h2>💰 바트 → 원화</h2>
  <div class="input-row">
    <input type="number" id="thbInput" placeholder="바트 입력"> THB
    <button onclick="convertToKRW('thb')">변환</button>
  </div>
  <div>결과: <span id="thbResult" class="result">0 원</span></div>
</div>

<!-- 🇻🇳 동 → 원화 -->
<div class="section">
  <h2>🇻🇳 동 → 원화</h2>
  <div class="input-row">
    <input type="number" id="vndInput" placeholder="동 입력"> VND
    <button onclick="convertToKRW('vnd')">변환</button>
  </div>
  <div>결과: <span id="vndResult" class="result">0 원</span></div>
</div>

<!-- 🇰🇷 원화 → 달러 -->
<div class="section">
  <h2>🇰🇷 원화 → 달러</h2>
  <div class="input-row">
    <input type="number" id="krwToUsdInput" placeholder="원화 입력"> 원
    <button onclick="convertFromKRW('usd')">변환</button>
  </div>
  <div>결과: <span id="krwToUsdResult" class="result">0 USD</span></div>
</div>

<!-- 🇰🇷 원화 → 엔화 -->
<div class="section">
  <h2>🇰🇷 원화 → 엔화</h2>
  <div class="input-row">
    <input type="number" id="krwToJpyInput" placeholder="원화 입력"> 원
    <button onclick="convertFromKRW('jpy')">변환</button>
  </div>
  <div>결과: <span id="krwToJpyResult" class="result">0 JPY</span></div>
</div>

<!-- 🇰🇷 원화 → 바트 -->
<div class="section">
  <h2>🇰🇷 원화 → 바트</h2>
  <div class="input-row">
    <input type="number" id="krwToThbInput" placeholder="원화 입력"> 원
    <button onclick="convertFromKRW('thb')">변환</button>
  </div>
  <div>결과: <span id="krwToThbResult" class="result">0 THB</span></div>
</div>

<!-- 🇰🇷 원화 → 동 -->
<div class="section">
  <h2>🇰🇷 원화 → 동</h2>
  <div class="input-row">
    <input type="number" id="krwToVndInput" placeholder="원화 입력"> 원
    <button onclick="convertFromKRW('vnd')">변환</button>
  </div>
  <div>결과: <span id="krwToVndResult" class="result">0 VND</span></div>
</div>

<script>
  // 환율 예시 (실제 API 연동 가능)
  const rates = {
    usd: 1390,
    jpy: 9.3,
    thb: 38.2,
    vnd: 0.056
  };

  // 외화 → 원화
  function convertToKRW(currency) {
    const input = document.getElementById(`${currency}Input`).value;
    const resultElement = document.getElementById(`${currency}Result`);
    if (!input) return;

    const rate = rates[currency];
    const converted = Math.round(input * rate).toLocaleString();

    animateResult(resultElement, `${converted} 원`);
  }

  // 원화 → 외화
  function convertFromKRW(currency) {
    const input = document.getElementById(`krwTo${currency.toUpperCase()}Input`).value;
    const resultElement = document.getElementById(`krwTo${currency.toUpperCase()}Result`);
    if (!input) return;

    const rate = rates[currency];
    const converted = (input / rate).toFixed(2).toLocaleString();

    animateResult(resultElement, `${converted} ${currency.toUpperCase()}`);
  }

  // 결과 강조 애니메이션
  function animateResult(element, text) {
    element.classList.remove('highlight');
    void element.offsetWidth; // reflow 강제
    element.textContent = text;
    element.classList.add('highlight');
  }
</script>
</body>
</html>
