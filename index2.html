<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>통화 변환</title>
<style>
  body {
    font-family: 'Pretendard', sans-serif;
    background: #f8f9fa;
    padding: 30px;
  }

  .section {
    background: #fff;
    border-radius: 12px;
    padding: 20px 30px;
    margin-bottom: 30px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.05);
  }

  h2 {
    color: #333;
    margin-bottom: 15px;
  }

  .result {
    font-size: 2rem;
    font-weight: 700;
    display: inline-block;
    background: linear-gradient(90deg, #fff79a 0%, #fff79a 100%);
    border-radius: 5px;
    padding: 5px 10px;
    transition: background 0.3s ease, transform 0.2s ease;
  }

  .highlight {
    animation: blink 0.6s ease;
    background: linear-gradient(90deg, #ffe66b 0%, #fff79a 100%);
    transform: scale(1.1);
  }

  @keyframes blink {
    0% { background: #fff79a; transform: scale(1.05); }
    50% { background: #ffe66b; transform: scale(1.15); }
    100% { background: #fff79a; transform: scale(1.05); }
  }

  .input-row {
    margin-bottom: 15px;
  }

  input {
    padding: 5px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
  }

  button {
    padding: 5px 10px;
    margin-left: 10px;
    border: none;
    border-radius: 6px;
    background: #007bff;
    color: white;
    cursor: pointer;
  }

  button:hover {
    background: #0056b3;
  }
</style>
</head>
<body>

<!-- 달러 → 원화 -->
<div class="section">
  <h2>💵 달러 → 원화</h2>
  <div class="input-row">
    기준 환율: <input type="number" id="usdRateInput" value="1429" step="1"> 원 / 달러  
  </div>
  <div class="input-row">
    <input type="number" id="usdInput" placeholder="달러 입력"> USD  
    <button onclick="adjustUSD(1)">+1</button>
    <button onclick="adjustUSD(-1)">-1</button>
    <button onclick="adjustUSD(10)">+10</button>
    <button onclick="adjustUSD(-10)">-10</button>
    <button onclick="adjustUSD(100)">+100</button>
    <button onclick="adjustUSD(-100)">-100</button>
    <button onclick="convertToKRW('usd')">변환</button>
  </div>
  <div>결과: <span id="usdResult" class="result">0 원</span></div>
</div>

<!-- 엔화 → 원화 -->
<div class="section">
  <h2>💴 엔화 → 원화</h2>
  <div class="input-row">
    기준 환율: <input type="number" id="jpyRateInput" value="9.42" step="0.01"> 원 / 엔  
  </div>
  <div class="input-row">
    <input type="number" id="jpyInput" placeholder="엔화 입력"> JPY  
    <button onclick="adjustJPY(100)">+100</button>
    <button onclick="adjustJPY(-100)">-100</button>
    <button onclick="adjustJPY(1000)">+1000</button>
    <button onclick="adjustJPY(-1000)">-1000</button>
    <button onclick="adjustJPY(10000)">+10000</button>
    <button onclick="adjustJPY(-10000)">-10000</button>
    <button onclick="convertToKRW('jpy')">변환</button>
  </div>
  <div>결과: <span id="jpyResult" class="result">0 원</span></div>
</div>

<!-- 바트 → 원화 -->
<div class="section">
  <h2>💰 바트 → 원화</h2>
  <div class="input-row">
    기준 환율: <input type="number" id="thbRateInput" value="38.2" step="0.1"> 원 / 바트  
  </div>
  <div class="input-row">
    <input type="number" id="thbInput" placeholder="바트 입력"> THB  
    <button onclick="convertToKRW('thb')">변환</button>
  </div>
  <div>결과: <span id="thbResult" class="result">0 원</span></div>
</div>

<!-- 동 → 원화 -->
<div class="section">
  <h2>🇻🇳 동 → 원화</h2>
  <div class="input-row">
    기준 환율: <input type="number" id="vndRateInput" value="0.056" step="0.001"> 원 / 동  
  </div>
  <div class="input-row">
    <input type="number" id="vndInput" placeholder="동 입력"> VND  
    <button onclick="convertToKRW('vnd')">변환</button>
  </div>
  <div>결과: <span id="vndResult" class="result">0 원</span></div>
</div>

<script>
  function convertToKRW(currency) {
    let inputEl = document.getElementById(`${currency}Input`);
    let rateEl = document.getElementById(`${currency}RateInput`);
    let resultEl = document.getElementById(`${currency}Result`);

    let input = parseFloat(inputEl.value);
    let rate = parseFloat(rateEl.value);
    if (isNaN(input) || isNaN(rate)) return;

    let converted = Math.round(input * rate).toLocaleString();
    // 애니메이션
    resultEl.classList.remove('highlight');
    void resultEl.offsetWidth;
    resultEl.textContent = `${converted} 원`;
    resultEl.classList.add('highlight');
  }

  function adjustUSD(amount) {
    let usdInput = document.getElementById("usdInput");
    let current = parseFloat(usdInput.value) || 0;
    current += amount;
    if (current < 0) current = 0;
    usdInput.value = current;
  }

  function adjustJPY(amount) {
    let jpyInput = document.getElementById("jpyInput");
    let current = parseFloat(jpyInput.value) || 0;
    current += amount;
    if (current < 0) current = 0;
    jpyInput.value = current;
  }
</script>

</body>
</html>
