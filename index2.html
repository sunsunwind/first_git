<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>통화 변환</title>
<style>
  body {
    font-family: 'Pretendard', sans-serif;
    background: #f8f9fa;
    padding: 30px;
  }

  .section {
    background: #fff;
    border-radius: 12px;
    padding: 20px 30px;
    margin-bottom: 30px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.05);
  }

  h2 {
    color: #333;
    margin-bottom: 15px;
  }

  .result {
    font-size: 2rem;
    font-weight: 700;
    display: inline-block;
    background: linear-gradient(90deg, #fff79a 0%, #fff79a 100%);
    border-radius: 5px;
    padding: 5px 10px;
    transition: background 0.3s ease, transform 0.2s ease;
  }

  .highlight {
    animation: blink 0.6s ease;
    background: linear-gradient(90deg, #ffe66b 0%, #fff79a 100%);
    transform: scale(1.1);
  }

  @keyframes blink {
    0% { background: #fff79a; transform: scale(1.05); }
    50% { background: #ffe66b; transform: scale(1.15); }
    100% { background: #fff79a; transform: scale(1.05); }
  }

  .input-row {
    margin-bottom: 15px;
  }

  input {
    padding: 5px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
  }

  button {
    padding: 5px 10px;
    margin-left: 10px;
    border: none;
    border-radius: 6px;
    background: #007bff;
    color: white;
    cursor: pointer;
  }

  button:hover {
    background: #0056b3;
  }
</style>
</head>
<body>

<!-- 달러 → 원화 -->
<div class="section">
  <h2>💵 달러 → 원화</h2>
  <div class="input-row">
    <input type="number" id="usdInput" placeholder="달러 입력"> USD
    <button onclick="convertToKRW('usd')">변환</button>
  </div>
  <div>결과: <span id="usdResult" class="result">0 원</span></div>
</div>

<!-- 엔화 → 원화 -->
<div class="section">
  <h2>💴 엔화 → 원화</h2>
  <div class="input-row">
    <input type="number" id="jpyInput" placeholder="엔화 입력"> JPY
    <button onclick="convertToKRW('jpy')">변환</button>
  </div>
  <div>결과: <span id="jpyResult" class="result">0 원</span></div>
</div>

<!-- 바트 → 원화 -->
<div class="section">
  <h2>💰 바트 → 원화</h2>
  <div class="input-row">
    <input type="number" id="thbInput" placeholder="바트 입력"> THB
    <button onclick="convertToKRW('thb')">변환</button>
  </div>
  <div>결과: <span id="thbResult" class="result">0 원</span></div>
</div>

<!-- 동 → 원화 -->
<div class="section">
  <h2>🇻🇳 동 → 원화</h2>
  <div class="input-row">
    <input type="number" id="vndInput" placeholder="동 입력"> VND
    <button onclick="convertToKRW('vnd')">변환</button>
  </div>
  <div>결과: <span id="vndResult" class="result">0 원</span></div>
</div>

<script>
  // 환율 예시 (실제는 API 연동 가능)
  const rates = {
    usd: 1390,
    jpy: 9.3,
    thb: 38.2,
    vnd: 0.056
  };

  function convertToKRW(currency) {
    const input = document.getElementById(`${currency}Input`).value;
    const resultElement = document.getElementById(`${currency}Result`);
    if (!input) return;

    const rate = rates[currency];
    const converted = Math.round(input * rate).toLocaleString();
    
    // 기존 애니메이션 제거 후 재적용 (변화감 강조)
    resultElement.classList.remove('highlight');
    void resultElement.offsetWidth; // reflow 강제
    resultElement.textContent = `${converted} 원`;
    resultElement.classList.add('highlight');
  }
</script>
</body>
</html>
