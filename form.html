<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>견적서 생성기</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        body {
            font-family: "Noto Sans KR", Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
        }

        .form-area, .preview-area {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 50%;
        }

        h2 {
            margin-top: 0;
        }

        input, textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
        }

        button {
            padding: 10px 16px;
            margin-right: 8px;
            cursor: pointer;
        }

        /* 견적서 스타일 */
        #estimate {
            width: 100%;
            border: 1px solid #000;
            padding: 20px;
            background: #fff;
        }

        #estimate h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: center;
        }

        .right {
            text-align: right;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #estimate, #estimate * {
                visibility: visible;
            }
            #estimate {
                position: absolute;
                left: 0;
                top: 0;
            }
        }
    </style>
</head>
<body>

<h1>견적서 작성</h1>

<div class="container">
    <!-- 입력 영역 -->
    <div class="form-area">
        <h2>입력</h2>

        <input type="text" placeholder="공급자명" oninput="updateText('provider', this.value)">
        <input type="text" placeholder="고객명" oninput="updateText('client', this.value)">
        <input type="date" oninput="updateText('date', this.value)">

        <textarea placeholder="품목 / 내용" oninput="updateText('item', this.value)"></textarea>
        <input type="number" placeholder="금액" oninput="updateText('price', this.value)">

        <button onclick="saveAsImage()">이미지로 저장</button>
        <button onclick="window.print()">인쇄</button>
    </div>

    <!-- 미리보기 영역 -->
    <div class="preview-area">
        <h2>미리보기</h2>

        <div id="estimate">
            <h1>견 적 서</h1>

            <p>공급자: <span id="provider">-</span></p>
            <p>고객명: <span id="client">-</span></p>
            <p>작성일: <span id="date">-</span></p>

            <table>
                <thead>
                    <tr>
                        <th>내용</th>
                        <th>금액 (원)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="item">-</td>
                        <td id="price" class="right">0</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function updateText(id, value) {
        document.getElementById(id).innerText = value || '-';
    }

    function saveAsImage() {
        const target = document.getElementById("estimate");
        html2canvas(target, { scale: 2 }).then(canvas => {
            const link = document.createElement("a");
            link.download = "견적서.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }
</script>

</body>
</html>
