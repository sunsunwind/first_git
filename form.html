<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>견적서</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body { font-family: "Noto Sans KR", Arial; }
.sheet {
    width: 900px;
    margin: auto;
    border: 2px solid #000;
    padding: 20px;
}
h1 {
    text-align: center;
    letter-spacing: 10px;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}
td, th {
    border: 1px solid #000;
    padding: 6px;
    text-align: center;
}
.no-border {
    border: none;
    text-align: left;
}

input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    text-align: center;
}

.inline { width: 150px; }
.right { text-align: right; }

/* 귀하 */
.recipient-input {
    font-size: 16px;
    font-weight: bold;
    border-bottom: 1px solid #000;
    text-align: left;
}

/* 날짜 입력 */
.date-input {
    width: 60px;
    border: none;
    border-bottom: 1px solid #000;
    text-align: center;
    font-size: 14px;
    outline: none;
}
.date-input.month,
.date-input.day {
    width: 40px;
}
</style>
</head>
<body>

<div class="sheet" id="estimate">

<!-- No / 날짜 -->
<div style="display:flex; justify-content:space-between;">
    <div>No. <input class="inline"></div>
    <input type="date" class="inline">
</div>

<h1>견 적 서</h1>

<table>
<tr>
<td class="no-border" style="width:60%;">

    <!-- 년 월 일 -->
    <div style="margin-bottom:8px;">
        <input class="date-input year"> 년
        <input class="date-input month"> 월
        <input class="date-input day"> 일
    </div>

    <input class="inline recipient-input">
    <strong> 귀하</strong>

    <div style="margin-top:10px;">아래와 같이 견적합니다.</div>
</td>

<td style="width:40%;">
    <table>
        <tr><th colspan="2">공   급   자</th></tr>
        <tr><td>성명</td><td>김석규</td></tr>
        <tr><td>업태</td><td>방통</td></tr>
        <tr><td>종목</td><td>미장공사</td></tr>
        <tr><td>연락처</td><td>010-3852-4574</td></tr>
    </table>
</td>
</tr>
</table>

<!-- 합계금액 -->
<table style="margin-top:10px;">
<tr>
<td style="width:30%">합계금액(공급가액)</td>
<td style="width:40%" id="korAmount"></td>
<td style="width:30%" class="right" id="supplyAmount"></td>
</tr>
</table>

<!-- 품목 -->
<table style="margin-top:10px;">
<thead>
<tr>
<th style="width:16%">품명</th>
<th style="width:16%">규격</th>
<th style="width:10%">수량</th>
<th style="width:14%">단가</th>
<th style="width:30%">총액</th>
<th style="width:14%">비고</th>
</tr>
</thead>

<tbody>
<tr class="item-row">
<td><input></td>
<td><input></td>
<td><input class="qty" oninput="recalc()"></td>
<td><input class="price" oninput="recalc()"></td>
<td class="row-total right"></td>
<td><input></td>
</tr>
<tr class="item-row">
<td><input></td>
<td><input></td>
<td><input class="qty" oninput="recalc()"></td>
<td><input class="price" oninput="recalc()"></td>
<td class="row-total right"></td>
<td><input></td>
</tr>
<tr class="item-row">
<td><input></td>
<td><input></td>
<td><input class="qty" oninput="recalc()"></td>
<td><input class="price" oninput="recalc()"></td>
<td class="row-total right"></td>
<td><input></td>
</tr>
<tr class="item-row">
<td><input></td>
<td><input></td>
<td><input class="qty" oninput="recalc()"></td>
<td><input class="price" oninput="recalc()"></td>
<td class="row-total right"></td>
<td><input></td>
</tr>

<tr>
<td>부가세</td>
<td colspan="3"></td>
<td class="right" id="vat"></td>
<td></td>
</tr>

<tr>
<td><strong>계(부가세 포함)</strong></td>
<td colspan="3"></td>
<td class="right" id="grandTotal"><strong></strong></td>
<td></td>
</tr>
</tbody>
</table>

</div>

<!-- 버튼 (이미지/인쇄 제외 영역) -->
<div style="text-align:center; margin:30px 0;">
    <button onclick="saveImage()">이미지 저장</button>
    <button onclick="window.print()">인쇄</button>
</div>

<script>
function recalc(){
    let sum = 0;

    document.querySelectorAll(".item-row").forEach(r=>{
        const q = parseFloat(r.querySelector(".qty").value) || 0;
        const p = parseFloat(r.querySelector(".price").value) || 0;

        if(q && p){
            const t = q * p;
            r.querySelector(".row-total").innerText = t.toLocaleString();
            sum += t;
        } else {
            r.querySelector(".row-total").innerText = "";
        }
    });

    if(sum === 0){
        supplyAmount.innerText = "";
        vat.innerText = "";
        grandTotal.innerText = "";
        korAmount.innerText = "";
        return;
    }

    const v = Math.round(sum * 0.1);
    supplyAmount.innerText = sum.toLocaleString();
    vat.innerText = v.toLocaleString();
    grandTotal.innerText = (sum + v).toLocaleString();
    korAmount.innerText = toKor(sum) + " 원";
}

function toKor(num){
    const n=["영","일","이","삼","사","오","육","칠","팔","구"];
    const t=["","십","백","천"];
    const u=["","만","억","조"];
    let r="", i=0;

    while(num>0){
        let c=num%10000, s="";
        for(let j=0;j<4;j++){
            const d=c%10;
            if(d) s=n[d]+t[j]+s;
            c=Math.floor(c/10);
        }
        if(s) r=s+u[i]+r;
        num=Math.floor(num/10000);
        i++;
    }
    return r || "영";
}

function saveImage(){
    html2canvas(document.getElementById("estimate"), {scale:2})
    .then(c=>{
        const a=document.createElement("a");
        a.download="견적서.png";
        a.href=c.toDataURL();
        a.click();
    });
}
</script>

</body>
</html>
