<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>견적서</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body { 
    font-family: "Noto Sans KR", Arial; 
    background: #f5f5f5;
    padding: 20px 0;
    font-size: 25px;
}

/* A4 비율 */
.sheet {
    width: 794px;
    min-height: 1123px;
    margin: auto;
    border: 2px solid #000;
    padding: 30px;
    box-sizing: border-box;
    background: #fff;
}

h1 {
    text-align: center;
    letter-spacing: 12px;
    font-size: 38px;
}

/* 테이블 */
table {
    width: 100%;
    border-collapse: collapse;
}
td, th {
    border: 1px solid #000;
    padding: 5px;
    text-align: center;
    font-size: 18px;
}
.no-border {
    border: none;
    text-align: left;
}

/* input */
input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 20px; 
    box-sizing: border-box;
}

.center-input { text-align: center; }
.right-input { text-align: right; padding-right: 10px; }
.right { text-align: right; }

/* 귀하 */
.recipient-input {
    font-size: 27px;
    font-weight: bold;
    border-bottom: 1px solid #000;
}

/* 날짜 */
.date-input {
    width: 60px;
    border: none;
    border-bottom: 1px solid #000;
    text-align: center;
}
.inline { width: 90px; }

/* 품목 행 */
.item-row td {
    height: 52px;
}
.item-row input {
    height: 100%;
    padding: 10px 6px;
}

/* 안내 문구 */
.notice {
    margin-bottom: 18px;
    font-size: 30px;
    color: #333;
    text-align: center;
}

/* 버튼 크게 */
.actions {
    text-align:center; 
    margin:40px 0;
}
button {
    padding: 20px 40px;
    font-size: 60px;
    font-weight: bold;
    cursor: pointer;
    margin: 0 15px;
}

/* 인쇄 */
@media print {
    body { margin: 0; padding: 0; }
    .sheet {
        width: 210mm;
        min-height: 297mm;
        border: none;
        padding: 15mm;
    }
    .actions { display: none; }
}
@page {
    size: A4;
    margin: 0;
}
</style>
</head>

<body>

<div class="sheet" id="estimate">

<!-- No / 날짜 -->
<div style="display:flex; justify-content:space-between;">
    <div>No. <input class="inline"></div>
    <input type="date" class="inline">
</div>

<h1>견 적 서</h1>

<table>
<tr>
<td class="no-border" style="width:60%;">
    <div style="margin-bottom:10px;">
        <input class="date-input"> 년
        <input class="date-input"> 월
        <input class="date-input"> 일
    </div>
    <input class="inline recipient-input"> <strong>귀하</strong>
    <div style="margin-top:12px;">아래와 같이 견적합니다.</div>
</td>

<td style="width:40%;">
<table>
<tr><th colspan="2">공 급 자</th></tr>
<tr><td>성명</td><td>김석규</td></tr>
<tr><td>업태</td><td>방통</td></tr>
<tr><td>종목</td><td>미장공사</td></tr>
<tr><td>연락처</td><td>010-3852-4574</td></tr>
</table>
</td>
</tr>
</table>

<!-- 합계 -->
<table style="margin-top:14px;">
<tr>
<td style="width:30%">합계금액<br>(부가세 포함)</td>
<td style="width:40%" id="korAmount"></td>
<td style="width:30%" class="right" id="supplyAmount"></td>
</tr>
</table>

<!-- 품목 -->
<table style="margin-top:14px;">
<thead>
<tr>
    <th style="width:26%">품명</th>
    <th style="width:20%">규격/수량</th>
  
    <th style="width:18%">단가</th>
    <th style="width:18%">총액</th>
    <th style="width:18%">비고</th>
</tr>
</thead>

<tbody>
<tr class="item-row">
<td><input></td>
<td><input class="center-input"></td>
<td><input class="qty center-input" oninput="formatNumber(this); recalc();"></td>
<td><input class="price right-input" oninput="formatNumber(this); recalc();"></td>
<td class="row-total right"></td>
<td><input></td>
</tr>
<tr class="item-row"><td><input></td><td><input class="center-input"></td><td><input class="qty center-input" oninput="formatNumber(this); recalc();"></td><td><input class="price right-input" oninput="formatNumber(this); recalc();"></td><td class="row-total right"></td><td><input></td></tr>
<tr class="item-row"><td><input></td><td><input class="center-input"></td><td><input class="qty center-input" oninput="formatNumber(this); recalc();"></td><td><input class="price right-input" oninput="formatNumber(this); recalc();"></td><td class="row-total right"></td><td><input></td></tr>
<tr class="item-row"><td><input></td><td><input class="center-input"></td><td><input class="qty center-input" oninput="formatNumber(this); recalc();"></td><td><input class="price right-input" oninput="formatNumber(this); recalc();"></td><td class="row-total right"></td><td><input></td></tr>
<tr class="item-row"><td><input></td><td><input class="center-input"></td><td><input class="qty center-input" oninput="formatNumber(this); recalc();"></td><td><input class="price right-input" oninput="formatNumber(this); recalc();"></td><td class="row-total right"></td><td><input></td></tr>
<tr class="item-row"><td><input></td><td><input class="center-input"></td><td><input class="qty center-input" oninput="formatNumber(this); recalc();"></td><td><input class="price right-input" oninput="formatNumber(this); recalc();"></td><td class="row-total right"></td><td><input></td></tr>

<tr>
<td>부가세</td>
<td colspan="3"></td>
<td class="right" id="vat"></td>
<td></td>
</tr>

<tr>
<td><strong>계(부가세 포함)</strong></td>
<td colspan="3"></td>
<td class="right" id="grandTotal"></td>
<td></td>
</tr>


</tbody>
* 계좌번호 : 새마을금고 김석수 16300-9010-4395
</table>

</div>

<div class="actions">
    <div class="notice">
        * 부가세 및 총액은 자동 계산됩니다.
    </div>

    <button onclick="saveImage()">📷 이미지 저장</button>
    <button onclick="window.print()">🖨 인쇄</button>
</div>

<script>
function removeComma(v){ return Number(v.replace(/,/g,"")) || 0; }
function formatNumber(el){ const n=removeComma(el.value); el.value=n?n.toLocaleString():""; }

function recalc(){
    let sum=0;
    document.querySelectorAll(".item-row").forEach(r=>{
        const q=removeComma(r.querySelector(".qty").value);
        const p=removeComma(r.querySelector(".price").value);
        if(q&&p){
            const t=q*p;
            r.querySelector(".row-total").innerText=t.toLocaleString();
            sum+=t;
        } else r.querySelector(".row-total").innerText="";
    });
    if(!sum){ vat.innerText=grandTotal.innerText=korAmount.innerText=supplyAmount.innerText=""; return;}
    const v=Math.round(sum*0.1), total=sum+v;
    vat.innerText=v.toLocaleString();
    grandTotal.innerText=total.toLocaleString();
    supplyAmount.innerText=total.toLocaleString();
    korAmount.innerText=toKor(total)+" 원";
}

function toKor(num){
    const n=["영","일","이","삼","사","오","육","칠","팔","구"];
    const t=["","십","백","천"];
    const u=["","만","억","조"];
    let r="",i=0;
    while(num>0){
        let c=num%10000,s="";
        for(let j=0;j<4;j++){
            const d=c%10;
            if(d)s=n[d]+t[j]+s;
            c=Math.floor(c/10);
        }
        if(s)r=s+u[i]+r;
        num=Math.floor(num/10000);
        i++;
    }
    return r||"영";
}

function saveImage(){
    html2canvas(document.getElementById("estimate"),{
        scale:2,
        backgroundColor:"#fff"
    }).then(c=>{
        const a=document.createElement("a");
        a.download="견적서.png";
        a.href=c.toDataURL();
        a.click();
    });
}
</script>

</body>
</html>
