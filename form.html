<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>견적서</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body { 
    font-family: "Noto Sans KR", Arial; 
    background: #f5f5f5;
    padding: 20px 0;
}

/* ✅ A4 비율 (화면/이미지저장 기준) */
.sheet {
    width: 794px;              /* A4 가로 (96dpi 기준) */
    min-height: 1123px;        /* A4 세로 */
    margin: auto;
    border: 2px solid #000;
    padding: 25px;
    box-sizing: border-box;
    background: #fff;
}

h1 {
    text-align: center;
    letter-spacing: 10px;
}

/* 테이블 */
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}
td, th {
    border: 1px solid #000;
    padding: 6px;
    text-align: center;
}
.no-border {
    border: none;
    text-align: left;
}

/* 기본 input */
input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    box-sizing: border-box;
}

/* 가운데 정렬 input (품명/규격/수량) */
.center-input {
    text-align: center !important;
    padding: 0 6px;
}

/* 우측 정렬 input (단가) */
.right-input {
    text-align: right !important;
    padding-right: 8px;
}

/* 우측 정렬 텍스트 */
.right { text-align: right; }

/* 귀하 */
.recipient-input {
    font-size: 16px;
    font-weight: bold;
    border-bottom: 1px solid #000;
    text-align: left;
}

/* 날짜 */
.date-input {
    width: 60px;
    border: none;
    border-bottom: 1px solid #000;
    text-align: center;
}
.date-input.month,
.date-input.day { width: 40px; }

.inline { width: 80px; }

/* ✅ 품목 테이블 행 높이 늘리기 */
.item-row td {
    height: 48px;
    vertical-align: middle;
}
.item-row input {
    height: 100%;
    padding: 10px 6px;
}

/* 버튼 영역 */
.actions {
    text-align:center; 
    margin:30px 0;
}
button {
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
}

/* ✅ 인쇄 시 A4로 맞추기 */
@media print {
    body {
        margin: 0;
        padding: 0;
        background: #fff;
    }
    .sheet {
        width: 210mm;
        min-height: 297mm;
        border: none;
        padding: 15mm;
        page-break-after: always;
    }
    .actions {
        display: none;
    }
}

@page {
    size: A4;
    margin: 0;
}
</style>
</head>

<body>

<div class="sheet" id="estimate">

    <!-- No / 날짜 -->
    <div style="display:flex; justify-content:space-between;">
        <div>No. <input class="inline"></div>
        <input type="date" class="inline">
    </div>

    <h1>견 적 서</h1>

    <table>
        <tr>
            <td class="no-border" style="width:60%;">

                <!-- 년 월 일 -->
                <div style="margin-bottom:8px;">
                    <input class="date-input year"> 년
                    <input class="date-input month"> 월
                    <input class="date-input day"> 일
                </div>

                <input class="inline recipient-input">
                <strong> 귀하</strong>

                <div style="margin-top:10px;">아래와 같이 견적합니다.</div>
            </td>

            <td style="width:40%;">
                <table>
                    <tr><th colspan="2">공 급 자</th></tr>
                    <tr><td>성명</td><td>김석규</td></tr>
                    <tr><td>업태</td><td>방통</td></tr>
                    <tr><td>종목</td><td>미장공사</td></tr>
                    <tr><td>연락처</td><td>010-3852-4574</td></tr>
                </table>
            </td>
        </tr>
    </table>

    <!-- 합계금액 -->
    <table style="margin-top:10px;">
        <tr>
            <td style="width:30%">합계금액(부가세 포함)</td>
            <td style="width:40%" id="korAmount"></td>
            <td style="width:30%" class="right" id="supplyAmount"></td>
        </tr>
    </table>

    <!-- 품목 -->
    <table style="margin-top:10px;">
        <thead>
            <tr>
                <th style="width:16%">품명</th>
                <th style="width:16%">규격</th>
                <th style="width:10%">수량</th>
                <th style="width:14%">단가</th>
                <th style="width:30%">총액</th>
                <th style="width:14%">비고</th>
            </tr>
        </thead>

        <tbody>
            <!-- ✅ 기존 4행 → 6행으로 증가 -->
            <tr class="item-row">
                <td><input class="center-input"></td>
                <td><input class="center-input"></td>
                <td><input class="qty center-input" oninput="formatNumber(this); recalc();"></td>
                <td><input class="price right-input" oninput="formatNumber(this); recalc();"></td>
                <td class="row-total right"></td>
                <td><input></td>
            </tr>

            <tr class="item-row">
                <td><input class="center-input"></td>
                <td><input class="center-input"></td>
                <td><input class="qty center-input" oninput="formatNumber(this); recalc();"></td>
                <td><input class="price right-input" oninput="formatNumber(this); recalc();"></td>
                <td class="row-total right"></td>
                <td><input></td>
            </tr>

            <tr class="item-row">
                <td><input class="center-input"></td>
                <td><input class="center-input"></td>
                <td><input class="qty center-input" oninput="formatNumber(this); recalc();"></td>
                <td><input class="price right-input" oninput="formatNumber(this); recalc();"></td>
                <td class="row-total right"></td>
                <td><input></td>
            </tr>

            <tr class="item-row">
                <td><input class="center-input"></td>
                <td><input class="center-input"></td>
                <td><input class="qty center-input" oninput="formatNumber(this); recalc();"></td>
                <td><input class="price right-input" oninput="formatNumber(this); recalc();"></td>
                <td class="row-total right"></td>
                <td><input></td>
            </tr>

            <tr class="item-row">
                <td><input class="center-input"></td>
                <td><input class="center-input"></td>
                <td><input class="qty center-input" oninput="formatNumber(this); recalc();"></td>
                <td><input class="price right-input" oninput="formatNumber(this); recalc();"></td>
                <td class="row-total right"></td>
                <td><input></td>
            </tr>

            <tr class="item-row">
                <td><input class="center-input"></td>
                <td><input class="center-input"></td>
                <td><input class="qty center-input" oninput="formatNumber(this); recalc();"></td>
                <td><input class="price right-input" oninput="formatNumber(this); recalc();"></td>
                <td class="row-total right"></td>
                <td><input></td>
            </tr>

            <tr>
                <td>부가세</td>
                <td colspan="3"></td>
                <td class="right" id="vat"></td>
                <td></td>
            </tr>

            <tr>
                <td><strong>계(부가세 포함)</strong></td>
                <td colspan="3"></td>
                <td class="right" id="grandTotal"></td>
                <td></td>
            </tr>
        </tbody>
    </table>

</div>

<div class="actions">
    <button onclick="saveImage()">이미지 저장</button>
    <button onclick="window.print()">인쇄</button>
</div>

<script>
function removeComma(v){
    return Number(v.replace(/,/g,"")) || 0;
}

function formatNumber(el){
    const n = removeComma(el.value);
    el.value = n ? n.toLocaleString() : "";
}

function recalc(){
    let sum = 0;

    document.querySelectorAll(".item-row").forEach(r=>{
        const qEl = r.querySelector(".qty");
        const pEl = r.querySelector(".price");

        const q = qEl ? removeComma(qEl.value) : 0;
        const p = pEl ? removeComma(pEl.value) : 0;

        if(q && p){
            const t = q * p;
            r.querySelector(".row-total").innerText = t.toLocaleString();
            sum += t;
        } else {
            r.querySelector(".row-total").innerText = "";
        }
    });

    if(sum === 0){
        supplyAmount.innerText = "";
        vat.innerText = "";
        grandTotal.innerText = "";
        korAmount.innerText = "";
        return;
    }

    const v = Math.round(sum * 0.1);
    const total = sum + v;

    supplyAmount.innerText = total.toLocaleString();
    vat.innerText = v.toLocaleString();
    grandTotal.innerText = total.toLocaleString();
    korAmount.innerText = toKor(total) + " 원";
}

function toKor(num){
    const n=["영","일","이","삼","사","오","육","칠","팔","구"];
    const t=["","십","백","천"];
    const u=["","만","억","조"];
    let r="", i=0;

    while(num>0){
        let c=num%10000, s="";
        for(let j=0;j<4;j++){
            const d=c%10;
            if(d) s=n[d]+t[j]+s;
            c=Math.floor(c/10);
        }
        if(s) r=s+u[i]+r;
        num=Math.floor(num/10000);
        i++;
    }
    return r || "영";
}

function saveImage(){
    html2canvas(document.getElementById("estimate"), {
        scale: 2,
        backgroundColor: "#ffffff",
        useCORS: true
    }).then(c=>{
        const a=document.createElement("a");
        a.download="견적서.png";
        a.href=c.toDataURL("image/png");
        a.click();
    });
}
</script>

</body>
</html>
