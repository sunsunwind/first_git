<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>견적서</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body { font-family:"Noto Sans KR", Arial; }
.sheet { width:900px; margin:auto; border:2px solid #000; padding:20px; }
h1 { text-align:center; letter-spacing:10px; }

table { width:100%; border-collapse:collapse; font-size:14px; }
td, th { border:1px solid #000; padding:6px; text-align:center; }
.no-border { border:none; text-align:left; }

.input {
    width:100%;
    border:1px dashed #aaa;
    background:#fafafa;
    padding:3px;
    font-size:14px;
    text-align:center;
}

.inline { width:160px; }

.print-value { display:none; }

/* 🔥 출력 모드 */
.print-mode .input { display:none !important; }
.print-mode .print-value { display:inline !important; }
.print-mode .no-print { display:none !important; }

/* 공급자 세로 라벨 */
.provider-wrap {
    display:flex;
}
.provider-label {
    writing-mode: vertical-rl;
    text-orientation: upright;
    border:1px solid #000;
    padding:10px 6px;
    font-weight:bold;
    margin-right:4px;
}
</style>
</head>
<body>

<div class="sheet" id="estimate">

<!-- No / 날짜 -->
<div style="display:flex; justify-content:space-between;">
    <div>
        No.
        <input class="input inline" oninput="sync(this)">
        <span class="print-value"></span>
    </div>
    <input type="date" class="input inline">
</div>

<h1>견 적 서</h1>

<table>
<tr>
<td class="no-border" style="width:60%;">
    <input class="input inline" placeholder="상호 또는 성명" oninput="sync(this)">
    <span class="print-value"></span>
    <strong> 귀하</strong>
    <div style="margin-top:10px;">아래와 같이 견적합니다.</div>
</td>

<td style="width:40%;">
    <div class="provider-wrap">
        <div class="provider-label">공급자</div>
        <table>
            <tr><td>성명</td><td>김석규</td></tr>
            <tr><td>업태</td><td>방통</td></tr>
            <tr><td>종목</td><td>미장공사</td></tr>
            <tr><td>연락처</td><td>010-3852-4574</td></tr>
        </table>
    </div>
</td>
</tr>
</table>

<!-- 합계금액 -->
<table style="margin-top:10px;">
<tr>
<td style="width:30%">합계금액(공급가액)</td>
<td style="width:40%" id="korAmount">영 원</td>
<td style="width:30%" class="right" id="supplyAmount">0</td>
</tr>
</table>

<!-- 품목 -->
<table style="margin-top:10px;">
<thead>
<tr>
<th>품명</th><th>규격</th><th>수량</th><th>단가</th><th>총액</th><th>비고</th>
</tr>
</thead>

<tbody id="itemBody">
<tr class="item-row">
<td><input class="input"></td>
<td><input class="input"></td>
<td><input class="input qty" oninput="recalc()"></td>
<td><input class="input price" oninput="recalc()"></td>
<td class="row-total">0</td>
<td><input class="input"></td>
</tr>
</tbody>

<tr>
<td>부가세</td><td colspan="3"></td>
<td id="vat">0</td><td></td>
</tr>

<tr>
<td><strong>계(부가세 포함)</strong></td>
<td colspan="3"></td>
<td id="grandTotal"><strong>0</strong></td>
<td></td>
</tr>
</table>

<!-- 행 추가 버튼 -->
<button onclick="addRow()" class="no-print" style="margin-top:8px;">+ 행 추가</button>

</div>

<!-- 하단 버튼 -->
<div style="text-align:center; margin-top:20px;" class="no-print">
<button onclick="saveImage()">이미지 저장</button>
<button onclick="printDoc()">인쇄</button>
</div>

<script>
function sync(input){
    input.nextElementSibling.innerText = input.value;
}

function addRow(){
    const row=document.querySelector(".item-row");
    const clone=row.cloneNode(true);
    clone.querySelectorAll("input").forEach(i=>i.value="");
    clone.querySelector(".row-total").innerText="0";
    document.getElementById("itemBody").appendChild(clone);
}

function recalc(){
    let sum=0;
    document.querySelectorAll(".item-row").forEach(r=>{
        const q=Number(r.querySelector(".qty").value)||0;
        const p=Number(r.querySelector(".price").value)||0;
        const t=q*p;
        r.querySelector(".row-total").innerText=t.toLocaleString();
        sum+=t;
    });

    const vat=Math.round(sum*0.1);
    document.getElementById("supplyAmount").innerText=sum.toLocaleString();
    document.getElementById("vat").innerText=vat.toLocaleString();
    document.getElementById("grandTotal").innerText=(sum+vat).toLocaleString();
    document.getElementById("korAmount").innerText=toKor(sum)+" 원";
}

function toKor(num){
    const n=["영","일","이","삼","사","오","육","칠","팔","구"];
    const u=["","만","억","조"];
    const t=["","십","백","천"];
    let r="",i=0;
    while(num>0){
        let c=num%10000,s="";
        for(let j=0;j<4;j++){
            let d=c%10;
            if(d) s=n[d]+t[j]+s;
            c=Math.floor(c/10);
        }
        if(s) r=s+u[i]+" "+r;
        num=Math.floor(num/10000); i++;
    }
    return r.trim()||"영";
}

/* 이미지 저장 */
function saveImage(){
    const el=document.getElementById("estimate");
    el.classList.add("print-mode");
    setTimeout(()=>{
        html2canvas(el,{scale:2}).then(c=>{
            const a=document.createElement("a");
            a.download="견적서.png";
            a.href=c.toDataURL();
            a.click();
            el.classList.remove("print-mode");
        });
    },100);
}

/* 인쇄 */
function printDoc(){
    const el=document.getElementById("estimate");
    el.classList.add("print-mode");
    setTimeout(()=>{
        window.print();
        el.classList.remove("print-mode");
    },100);
}
</script>

</body>
</html>
