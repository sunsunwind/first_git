<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>견적서</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
    body {
        font-family: "Noto Sans KR", Arial, sans-serif;
        background: #fff;
        padding: 20px;
    }

    .sheet {
        width: 900px;
        margin: auto;
        border: 2px solid #000;
        padding: 20px;
    }

    h1 {
        text-align: center;
        letter-spacing: 10px;
        margin: 10px 0 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
    }

    td, th {
        border: 1px solid #000;
        padding: 6px;
        vertical-align: middle;
    }

    .no-border {
        border: none;
    }

    .center {
        text-align: center;
    }

    .right {
        text-align: right;
    }

    input {
        width: 100%;
        border: none;
        outline: none;
        font-size: 14px;
        text-align: center;
        background: transparent;
    }

    .actions {
        text-align: center;
        margin-top: 20px;
    }

    button {
        padding: 10px 20px;
        margin: 0 5px;
        cursor: pointer;
    }

    @media print {
        body * {
            visibility: hidden;
        }
        .sheet, .sheet * {
            visibility: visible;
        }
        .sheet {
            position: absolute;
            left: 0;
            top: 0;
        }
    }
</style>
</head>
<body>

<div class="sheet" id="estimate">

    <div style="display:flex; justify-content:space-between;">
        <div>No.</div>
        <div>
            <input type="date">
        </div>
    </div>

    <h1>견 적 서</h1>

    <table>
        <tr>
            <td class="no-border" style="width:70%">
                <strong style="font-size:20px;">주식회사 이소</strong><br><br>
                <input type="text" placeholder="귀하 입력">
                <div style="margin-top:10px;">아래와 같이 견적합니다.</div>
            </td>
            <td style="width:30%">
                <table>
                    <tr>
                        <td class="center">등록번호</td>
                        <td></td>
                    </tr>
                    <tr>
                        <td class="center">상호(법인명)</td>
                        <td>김석규</td>
                    </tr>
                    <tr>
                        <td class="center">사업장주소</td>
                        <td></td>
                    </tr>
                    <tr>
                        <td class="center">업태</td>
                        <td>방통</td>
                    </tr>
                    <tr>
                        <td class="center">종목</td>
                        <td>미장공사</td>
                    </tr>
                    <tr>
                        <td class="center">연락처</td>
                        <td>010-3852-4574</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <table style="margin-top:10px;">
        <tr>
            <td style="width:30%">합계금액(공급가액)</td>
            <td style="width:40%" class="center">일백오십사만 원 整</td>
            <td style="width:30%" class="right">
                <input type="text" placeholder="1,540,000">
            </td>
        </tr>
    </table>

    <table style="margin-top:10px;">
        <tr class="center">
            <th>품명</th>
            <th>규격</th>
            <th>수량</th>
            <th>단가</th>
            <th>총액</th>
            <th>비고</th>
        </tr>
        <tr>
            <td><input type="text"></td>
            <td><input type="text"></td>
            <td><input type="text"></td>
            <td><input type="text"></td>
            <td><input type="text"></td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td class="center">부가세</td>
            <td colspan="3"></td>
            <td><input type="text"></td>
            <td></td>
        </tr>
        <tr>
            <td class="center"><strong>계(부가세 포함)</strong></td>
            <td colspan="3"></td>
            <td><input type="text"></td>
            <td></td>
        </tr>
    </table>

</div>

<div class="actions">
    <button onclick="saveImage()">이미지 저장</button>
    <button onclick="window.print()">인쇄</button>
</div>

<script>
function saveImage() {
    html2canvas(document.getElementById("estimate"), {scale:2})
    .then(canvas => {
        const link = document.createElement("a");
        link.download = "견적서.png";
        link.href = canvas.toDataURL();
        link.click();
    });
}
</script>

</body>
</html>
