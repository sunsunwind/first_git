<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON REBOUND - Sophisticated HTML5 Game</title>
    <style>
        :root {
            --bg-color: #050509;
            --primary-neon: #00f2fe; /* Cyan */
            --secondary-neon: #4facfe; /* Blue */
            --accent-neon: #ff00de; /* Magenta */
            --text-color: #ffffff;
            --shadow-glow: 0 0 15px rgba(0, 242, 254, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            color: var(--text-color);
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            background: radial-gradient(circle at center, #101020 0%, #050509 100%);
            display: block;
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(5, 5, 9, 0.85);
            backdrop-filter: blur(5px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            z-index: 10;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        h1.game-title {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(to right, var(--primary-neon), var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 0, 222, 0.5));
        }

        .status-text {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .neon-btn {
            padding: 12px 30px;
            font-size: 1rem;
            background: transparent;
            border: 2px solid var(--primary-neon);
            color: var(--primary-neon);
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: var(--shadow-glow);
        }

        .neon-btn:hover {
            background-color: var(--primary-neon);
            color: var(--bg-color);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.9);
        }

        /* Game HUD (Score/Lives) */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            z-index: 5;
        }

        .hud-val {
            color: var(--primary-neon);
            font-weight: bold;
            text-shadow: 0 0 5px var(--primary-neon);
        }

    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="hud">
            <div>SCORE: <span id="scoreVal" class="hud-val">0</span></div>
            <div>LIVES: <span id="livesVal" class="hud-val">3</span></div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="startOverlay" class="overlay active">
            <h1 class="game-title">NEON REBOUND</h1>
            <p class="status-text">Move mouse to control paddle. Break all bricks.</p>
            <button class="neon-btn" onclick="startGame()">Start Game</button>
        </div>

        <div id="gameOverOverlay" class="overlay">
            <h1 class="game-title" style="filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.7)); background: linear-gradient(to right, #ff416c, #ff4b2b); -webkit-background-clip: text;">GAME OVER</h1>
            <p class="status-text">Final Score: <span id="finalScore" class="hud-val">0</span></p>
            <button class="neon-btn" onclick="startGame()">Try Again</button>
        </div>
    </div>

    <script>
        // --- Configuration & Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const scoreDisplay = document.getElementById('scoreVal');
        const livesDisplay = document.getElementById('livesVal');
        const finalScoreDisplay = document.getElementById('finalScore');

        // Neon Colors
        const COLOR_PADDLE = '#00f2fe';
        const COLOR_BALL = '#ffffff';
        const BRICK_COLORS = ['#ff00de', '#4facfe', '#00f2fe', '#ff00de', '#4facfe']; // Top to bottom

        // Game State
        let score = 0;
        let lives = 3;
        let isGameRunning = false;
        let animationId;

        // --- Game Objects ---

        // Paddle
        const paddle = {
            width: 120,
            height: 12,
            x: canvas.width / 2 - 60,
            y: canvas.height - 30,
            borderRadius: 6,
            glow: 15
        };

        // Ball
        const ball = {
            radius: 7,
            x: canvas.width / 2,
            y: paddle.y - 10,
            speed: 6,
            dx: 0,
            dy: 0,
            glow: 10
        };

        // Bricks
        const brickConfig = {
            rowCount: 5,
            colCount: 9,
            width: 76,
            height: 20,
            padding: 10,
            offsetTop: 70,
            offsetLeft: 25
        };

        let bricks = [];

        // Particles (for break effect)
        let particles = [];

        // --- Initialization ---
        function initGame() {
            score = 0;
            lives = 3;
            updateHUD();
            
            // Init Bricks with a slight random placement animation start
            bricks = [];
            for (let c = 0; c < brickConfig.colCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickConfig.rowCount; r++) {
                    bricks[c][r] = { 
                        x: 0, 
                        y: 0, 
                        status: 1, // 1: active, 0: breaking, -1: dead
                        color: BRICK_COLORS[r],
                        opacity: 1,
                        scale: 1
                    };
                }
            }

            resetBall();
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = paddle.y - ball.radius - 1;
            ball.dx = ball.speed * (Math.random() > 0.5 ? 1 : -1) * 0.7; // Random angle
            ball.dy = -ball.speed;
        }

        // --- Input Handling ---
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const root = document.documentElement;
            const mouseX = e.clientX - rect.left - root.scrollLeft;
            
            paddle.x = mouseX - paddle.width / 2;

            // Boundary checks
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
        });

        // --- Core Game Loop ---
        function startGame() {
            startOverlay.classList.remove('active');
            gameOverOverlay.classList.remove('active');
            initGame();
            isGameRunning = true;
            gameLoop();
        }

        function gameOver() {
            isGameRunning = false;
            cancelAnimationFrame(animationId);
            finalScoreDisplay.innerText = score;
            gameOverOverlay.classList.add('active');
        }

        function gameLoop() {
            if (!isGameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear background

            updateLogic();
            drawScene();

            animationId = requestAnimationFrame(gameLoop);
        }

        // --- Game Logic & Physics ---
        function updateLogic() {
            // Move Ball
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall Collisions
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
                createParticles(ball.x, ball.y, COLOR_BALL, 5);
            }
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
                createParticles(ball.x, ball.y, COLOR_BALL, 5);
            }

            // Paddle Collision
            if (ball.y + ball.radius > paddle.y && 
                ball.y - ball.radius < paddle.y + paddle.height &&
                ball.x > paddle.x && 
                ball.x < paddle.x + paddle.width) {
                
                ball.dy = -ball.speed;
                // Calculate hit angle based on where it hit the paddle
                let hitRatio = (ball.x - (paddle.x + paddle.width/2)) / (paddle.width / 2);
                ball.dx = hitRatio * ball.speed * 1.3; // Give it some arc
                createParticles(ball.x, ball.y, COLOR_PADDLE, 8);
            }

            // Brick Collisions
            let allBricksCleared = true;
            for (let c = 0; c < brickConfig.colCount; c++) {
                for (let r = 0; r < brickConfig.rowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        allBricksCleared = false;
                        if (ball.x > b.x && ball.x < b.x + brickConfig.width && 
                            ball.y > b.y && ball.y < b.y + brickConfig.height) {
                            
                            ball.dy = -ball.dy;
                            b.status = 0; // Start breaking animation
                            score += 10;
                            updateHUD();
                            createParticles(b.x + brickConfig.width/2, b.y + brickConfig.height/2, b.color, 15);
                        }
                    }
                }
            }

            if(allBricksCleared && isGameRunning) {
                // simple win condition: just reset bricks
                setTimeout(initGame, 1000); 
            }

            // Ball Floor Collision (Lose Life)
            if (ball.y + ball.radius > canvas.height) {
                lives--;
                updateHUD();
                if (lives <= 0) {
                    gameOver();
                } else {
                    resetBall();
                }
            }

            // Update Breaking Bricks Animation
            for (let c = 0; c < brickConfig.colCount; c++) {
                for (let r = 0; r < brickConfig.rowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 0) {
                        b.opacity -= 0.1;
                        b.scale += 0.05;
                        if (b.opacity <= 0) {
                            b.status = -1; // Dead
                        }
                    }
                }
            }

            // Update Particles
            particles.forEach((p, index) => {
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= 0.02;
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });
        }

        // --- Drawing ---
        function drawScene() {
            // Set global neon glow
            ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
            ctx.shadowBlur = 0;

            drawBricks();
            drawPaddle();
            drawBall();
            drawParticles();
        }

        function drawPaddle() {
            ctx.save();
            ctx.fillStyle = COLOR_PADDLE;
            ctx.shadowColor = COLOR_PADDLE;
            ctx.shadowBlur = paddle.glow;
            
            // Rounded rectangle
            ctx.beginPath();
            const x = paddle.x, y = paddle.y, w = paddle.width, h = paddle.height, r = paddle.borderRadius;
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function drawBall() {
            ctx.save();
            ctx.fillStyle = COLOR_BALL;
            ctx.shadowColor = COLOR_BALL;
            ctx.shadowBlur = ball.glow;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();
            ctx.restore();
        }

        function drawBricks() {
            for (let c = 0; c < brickConfig.colCount; c++) {
                for (let r = 0; r < brickConfig.rowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status >= 0) { // Drawing active and breaking bricks
                        const brickX = (c * (brickConfig.width + brickConfig.padding)) + brickConfig.offsetLeft;
                        const brickY = (r * (brickConfig.height + brickConfig.padding)) + brickConfig.offsetTop;
                        b.x = brickX;
                        b.y = brickY;

                        ctx.save();
                        ctx.fillStyle = b.color;
                        ctx.globalAlpha = b.opacity;
                        
                        // Neon glow for active bricks
                        if(b.status === 1) {
                            ctx.shadowColor = b.color;
                            ctx.shadowBlur = 12;
                        }

                        // Drawing logic for breaking animation
                        if(b.status === 0) {
                            // Scale from center
                            const centerX = brickX + brickConfig.width / 2;
                            const centerY = brickY + brickConfig.height / 2;
                            ctx.translate(centerX, centerY);
                            ctx.scale(b.scale, b.scale);
                            ctx.translate(-centerX, -centerY);
                        }

                        // Draw the brick (rounded)
                        ctx.beginPath();
                        const br = 4; // brick radius
                        ctx.moveTo(brickX + br, brickY);
                        ctx.lineTo(brickX + brickConfig.width - br, brickY);
                        ctx.quadraticCurveTo(brickX + brickConfig.width, brickY, brickX + brickConfig.width, brickY + br);
                        ctx.lineTo(brickX + brickConfig.width, brickY + brickConfig.height - br);
                        ctx.quadraticCurveTo(brickX + brickConfig.width, brickY + brickConfig.height, brickX + brickConfig.width - br, brickY + brickConfig.height);
                        ctx.lineTo(brickX + br, brickY + brickConfig.height);
                        ctx.quadraticCurveTo(brickX, brickY + brickConfig.height, brickX, brickY + brickConfig.height - br);
                        ctx.lineTo(brickX, brickY + br);
                        ctx.quadraticCurveTo(brickX, brickY, brickX + br, brickY);
                        ctx.closePath();
                        ctx.fill();

                        ctx.restore();
                    }
                }
            }
        }

        // --- Effects (Particles) ---
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 5,
                    dy: (Math.random() - 0.5) * 5,
                    radius: Math.random() * 2 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        // --- UI Updates ---
        function updateHUD() {
            scoreDisplay.innerText = score;
            livesDisplay.innerText = lives;
        }

    </script>
</body>
</html>
